<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>不動產估價 考題練習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background: #f8fafc; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeUp 0.25s ease forwards; }
        .option-btn { transition: background 0.15s, border-color 0.15s, color 0.15s; }
        .option-btn:active:not(:disabled) { transform: scale(0.97); }
        .opt-correct  { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .opt-wrong    { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .opt-selected { background: #dbeafe !important; border-color: #3b82f6 !important; color: #1d4ed8 !important; }
        .progress-bar { transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 font-sans">

<div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">

    <!-- ══════════════════ HUB SCREEN ══════════════════ -->
    <div id="hubView" class="flex flex-col flex-grow p-6 gap-6">
        <div class="pt-10 text-center">
            <p class="text-xs font-black text-blue-500 uppercase tracking-widest mb-2">不動產估價</p>
            <h1 class="text-2xl font-black text-slate-900 leading-snug">選擇章節</h1>
            <p class="text-slate-400 mt-1 text-sm">點選章節開始練習</p>
        </div>

        <div id="hubList" class="flex flex-col gap-4 pb-16"></div>
    </div>


    <!-- ══════════════════ START SCREEN ══════════════════ -->
    <div id="startView" class="hidden flex-col flex-grow p-6 gap-6">
        <div class="pt-8">
            <button onclick="showHub()" class="p-2 bg-slate-50 rounded-full text-slate-400 active:bg-slate-100 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
        </div>

        <div class="flex flex-col items-center text-center gap-4 flex-grow justify-center">
            <div id="startIcon" class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center text-4xl">🏗️</div>
            <div>
                <p id="startSubject" class="text-xs font-black text-blue-500 uppercase tracking-widest mb-2">不動產估價</p>
                <h1 id="startTitle" class="text-2xl font-black text-slate-900 leading-snug">第五章 成本法</h1>
                <p class="text-slate-400 mt-2 text-sm font-medium">共 <span id="startCount" class="text-slate-700 font-black">40</span> 題單選題</p>
            </div>

            <div class="w-full bg-white rounded-3xl border border-slate-100 shadow-sm p-5 text-left space-y-3">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">選擇模式</p>
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="radio" name="mode" value="practice" checked class="accent-blue-500 w-4 h-4">
                    <div>
                        <p class="font-black text-slate-800 text-sm">練習模式</p>
                        <p class="text-xs text-slate-400">選完立即顯示對錯與正確答案</p>
                    </div>
                </label>
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="radio" name="mode" value="exam" class="accent-blue-500 w-4 h-4">
                    <div>
                        <p class="font-black text-slate-800 text-sm">測驗模式</p>
                        <p class="text-xs text-slate-400">全部作答完畢後才顯示結果</p>
                    </div>
                </label>
            </div>

            <button onclick="startQuiz()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all text-base">
                開始作答
            </button>

            <button onclick="showBrowse()" class="w-full py-3.5 bg-slate-50 text-slate-600 border-2 border-slate-100 font-black rounded-2xl active:scale-95 transition-all text-sm">
                瀏覽所有題目
            </button>
        </div>
    </div>


    <!-- ══════════════════ QUIZ SCREEN ══════════════════ -->
    <div id="quizView" class="hidden flex-col min-h-screen">
        <div class="bg-white px-5 pt-8 pb-4 border-b border-slate-100 sticky top-0 z-10">
            <div class="flex justify-between items-center mb-3">
                <button onclick="confirmExit()" class="p-2 bg-slate-50 rounded-full text-slate-400 active:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
                <span id="qCounter" class="text-sm font-black text-slate-500">1 / 40</span>
                <span id="scoreChip" class="text-sm font-black text-emerald-700 bg-emerald-50 border border-emerald-100 px-3 py-1 rounded-full">0 分</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-1.5">
                <div id="qProgress" class="bg-blue-500 h-1.5 rounded-full progress-bar" style="width:2.5%"></div>
            </div>
        </div>
        <div id="qBody" class="flex-grow p-5 pb-12 overflow-y-auto no-scrollbar"></div>
    </div>


    <!-- ══════════════════ BROWSE SCREEN ══════════════════ -->
    <div id="browseView" class="hidden flex-col min-h-screen">
        <div class="bg-white px-5 pt-8 pb-4 border-b border-slate-100 sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <button onclick="showView('startView')" class="p-2 bg-slate-50 rounded-full text-slate-400 active:bg-slate-100 transition flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="flex-grow">
                    <p id="browseChapterTitle" class="font-black text-slate-900 text-base leading-tight"></p>
                    <p id="browseChapterCount" class="text-xs text-slate-400 font-medium"></p>
                </div>
            </div>
        </div>
        <div id="browseBody" class="flex-grow p-5 pb-16 overflow-y-auto no-scrollbar flex flex-col gap-5"></div>
    </div>


    <!-- ══════════════════ RESULT SCREEN ══════════════════ -->
    <div id="resultView" class="hidden flex-col gap-5 p-5 pt-10 pb-12">
        <div class="text-center">
            <div id="resultEmoji" class="text-5xl mb-3">🎉</div>
            <h2 class="text-3xl font-black text-slate-900">測驗完成！</h2>
        </div>
        <div class="bg-blue-600 rounded-3xl p-6 text-white text-center shadow-xl">
            <p class="text-xs font-black uppercase tracking-widest opacity-70 mb-1">得分</p>
            <p id="finalScore" class="text-5xl font-black">0 / 40</p>
            <p id="finalPct" class="text-sm font-bold opacity-80 mt-2">0%</p>
        </div>
        <h3 class="font-black text-slate-500 text-[10px] uppercase tracking-widest">逐題回顧</h3>
        <div id="reviewList" class="flex flex-col gap-3"></div>
        <div id="resultBtns" class="flex flex-col gap-3 pt-2"></div>
    </div>

</div><!-- #app -->

<script>
// ─── 題庫 ─────────────────────────────────────────────────────────────────────
const CHAPTERS = [
  {
    icon: '🏗️', iconBg: 'bg-blue-100', accentText: 'text-blue-500', label: 'Chapter 5', subject: '不動產估價',
    title: '第五章 成本法',
    questions: [
      // ── 成本法 上 (第01–20題) ──
      { no:"01", q:"以成本法推估不動產價格，下列何者無需納入估價之作業程序？", opts:["估計基地價值","估計建物重置成本","估計增值額","估計各項折舊額"], ans:2 },
      { no:"02", q:"建物估價，以下列何種方法估價為原則？", opts:["比較法","收益法","成本法","土地開發分析"], ans:2 },
      { no:"03", q:"附著於土地之工事及水利土壤之改良，以下列何種方法估價為原則？", opts:["成本法","比較法","收益法","計量模型分析法"], ans:0 },
      { no:"04", q:"建物估價，以何種估價方法估價為原則？", opts:["成本法","比較法","收益法","定額法"], ans:0 },
      { no:"05", q:"運用成本法進行不動產估價，下列何者不需納入計算？", opts:["土地總成本","建物總成本","建物累積折舊額","土地增值"], ans:3 },
      { no:"06", q:"與勘估標的相同效用之建物，以現代建材標準、設計及配置，於價格日期建築所需之成本，稱為什麼成本？", opts:["重建成本","再造成本","完工成本","重置成本"], ans:3 },
      { no:"07", q:"以建築細部工程之各項目單價乘以該工程施工數量之總和，計算勘估標的之營造或施工費用的方法稱為：", opts:["單位工程法","工程造價比率法","單位面積或體積法","淨計法"], ans:0 },
      { no:"08", q:"以建築細部工程之各項目單價乘以該工程施工數量，藉以估計勘估標的之營造或施工費，此方法稱為：", opts:["淨計法","單位工程法","單位面積法","工程造價比較法"], ans:1 },
      { no:"09", q:"成本法中重建成本或重置成本，是指求取勘估標的於何時的價格？", opts:["建造完成日期","價格期日","價格日期","勘查日期"], ans:2 },
      { no:"10", q:"運用標準營造單價表配合勘估標的之個別條件差異進行調整，以求得勘估標的的營造費用之方法，稱之為：", opts:["淨計法","工程造價比較法","單位工程法","單位面積比較法"], ans:3 },
      { no:"11", q:"依不動產估價技術規則之規定，採成本法評估建物價格時，以求取何種成本為原則？", opts:["重建成本","重置成本","興建成本","營造成本"], ans:0 },
      { no:"12", q:"下列何種方法求算之重建成本最為詳實？", opts:["淨計法","單位工程法","工程造價比率法","單位面積法"], ans:0 },
      { no:"13", q:"根據不動產估價技術規則，下列何者非成本法中估算勘估標的之開發或建築適當利潤應考量之因素？", opts:["工程規模","開發年數","經濟景氣","開發機構"], ans:3 },
      { no:"14", q:"在成本法中，勘估標的之營造或施工費，得按下列何種方法求取？", opts:["百分率法","差額法","淨計法","價格法"], ans:2 },
      { no:"15", q:"下列何者為建物興建之間接成本？", opts:["營造或施工費","建築利潤","規劃設計費","人工成本"], ans:2 },
      { no:"16", q:"依據不動產估價技術規則，下列何者是土地建築開發之直接成本？", opts:["規劃設計費","廣告費","營造或施工費","管理費"], ans:2 },
      { no:"17", q:"重新建造與勘估標的完全相同之新建築物所需之成本稱為：", opts:["直接成本","間接成本","重建成本","重置成本"], ans:2 },
      { no:"18", q:"建築物因功能或效益衰退至不值得使用所經歷之年數，稱之為何？", opts:["物理耐用年數","化學耐用年數","經濟耐用年數","建築耐用年數"], ans:2 },
      { no:"19", q:"下列何者非估計勘估標的之營造或施工費時應包括之成本？", opts:["稅捐","間接人工費","資本利息","廣告費"], ans:3 },
      { no:"20", q:"依建築細部工程之各項目單價，乘以該工程施工數量，並合計之，此方法為何？", opts:["工程造價比較法","單位工程法","淨計法","單位面積比較法"], ans:1 },
      // ── 成本法 下 (第21–40題) ──
      { no:"21", q:"建物耐用年數屆滿時之剩餘價格＝（）×殘值率，請問括弧內，應以下列何者為正確？", opts:["建物重建成本","建物折舊額","積算價格","交易價格"], ans:0 },
      { no:"22", q:"由於建築物與基地之配合不適宜、設計不良致效率降低，所引起之不動產相對減價，可認定為何種因素減價？", opts:["經濟的","功能的","物理的","社會的"], ans:1 },
      { no:"23", q:"設某建物之耐用年數為N，殘餘價格率為r，依定額法原則，其年折舊率公式為：", opts:["(1-r)/N","N/(1-r)","(1-r)×N","(1+r)×N"], ans:0 },
      { no:"24", q:"運用折舊提存金加計利息等於投資之資產本金，作為計算折舊額之方法，稱為：", opts:["年數合計法","償還基金法","定額法","定率法"], ans:1 },
      { no:"25", q:"假設市場上住宅衛浴設備的標準設計為2套，今勘估標的之衛浴設備為1.5套，請問於此條件下需進行何種折舊？", opts:["物理性折舊","功能性折舊","經濟性折舊","外部性折舊"], ans:1 },
      { no:"26", q:"下列何者屬外部性退化而產生折舊？", opts:["建物外牆剝落","中庭之游泳池荒置","屋頂漏水","位於淹水區"], ans:3 },
      { no:"27", q:"位於貧民區之高級住宅，其價值將發生相對減損。請問造成該減損的原因來自何種折舊？", opts:["心理性折舊","物理性折舊","功能性折舊","經濟性折舊"], ans:3 },
      { no:"28", q:"造成不動產減價的原因有好幾種。如果減價是由於不動產設備落伍所造成，則此減價屬於何種折舊？", opts:["物理折舊","經濟折舊","環境折舊","功能折舊"], ans:3 },
      { no:"29", q:"依不動產估價技術規則之規定，建物之殘餘價格率不得超過下列何者？", opts:["百分之五","百分之十","百分之二十","百分之三十"], ans:1 },
      { no:"30", q:"一棟樓房因鄰地建築而產生牆壁龜裂情形，請問該棟樓房將產生下列何種折舊？", opts:["物理性折舊","功能性折舊","經濟性折舊","外部性折舊"], ans:0 },
      { no:"31", q:"當不動產管理對不動產價格的影響無法藉由耐用年數法確切分析時，可運用下列何種方法掌握？", opts:["定額法","定率法","償債基金法","觀察法"], ans:3 },
      { no:"32", q:"建築物因功能或效益衰退至不值得使用所經歷之年數，稱為：", opts:["經濟耐用年數","物理耐用年數","觀察耐用年數","社會耐用年數"], ans:0 },
      { no:"33", q:"建物折舊額計算應以下列何種年數為主？", opts:["社會耐用年數","經濟耐用年數","實際經歷年數","物理耐用年數"], ans:1 },
      { no:"34", q:"根據不動產估價技術規則，建物因自然耗損或外力破壞至結構脆弱而不堪使用所經歷之年數，稱為：", opts:["社會耐用年數","經濟耐用年數","實際經歷年數","物理耐用年數"], ans:3 },

      { no:"36", q:"依不動產估價技術規則之規定，成本法中對建築物累積折舊之計算，以何種方法為原則？", opts:["定額法","定率法","償債基金法","殘餘法"], ans:0 },
      { no:"37", q:"對於大賣場等商用不動產，使用初期營收價值高、建物保養維護較佳者，宜採何種折舊方法？", opts:["定額法","償還基金法","定率法","年數合計法"], ans:1 },
      { no:"38", q:"下列何者係以殘餘耐用年數為權數而加速折舊的方法？", opts:["償還基金法","定額法","定率法","年數合計法"], ans:3 },
      { no:"39", q:"用何種方法計算建築物折舊額時，其殘餘價格不得為零？", opts:["償債基金法","定額法","定率法","直線法"], ans:2 },
      { no:"40", q:"因接近基地台而引起之價值減損，屬於下列何種折舊？", opts:["物理性折舊","功能性折舊","特殊性折舊","經濟性折舊"], ans:3 }

  {
    icon: '📊', iconBg: 'bg-emerald-100', accentText: 'text-emerald-500', label: 'Chapter 6', subject: '不動產估價',
    title: '第六章 比較法',
    questions: [
      { no:"01", q:"運用迴歸分析法，截距項以外其他各主要影響價格因素之迴歸係數估計值同時為零之顯著機率不得大於下列何者？", opts:["百分之五","百分之七","百分之十五","百分之三十"], ans:0 },
      { no:"02", q:"運用比較法估價時，下列何者較不宜列入比較項目？", opts:["物理性特徵","區位","交易情況","三年前之擬售價格"], ans:3 },

      { no:"04", q:"使用迴歸分析法估價時，比較標的至少需要幾件以上？", opts:["三十件","二十五件","三十五件","二十件"], ans:0 },

// ─── State ────────────────────────────────────────────────────────────────────
let chapterIdx      = 0;
let mode            = 'practice';
let answers         = [];
let current         = 0;
let activeQuestions = null; // null = use chapter questions; array = wrong-question subset

function currentQuestions() { return activeQuestions ?? CHAPTERS[chapterIdx].questions; }

// ─── Hub ──────────────────────────────────────────────────────────────────────
function renderHub() {
    document.getElementById('hubList').innerHTML = CHAPTERS.map((ch, i) => `
        <button onclick="selectChapter(${i})"
            class="w-full bg-white border-2 border-slate-100 rounded-3xl p-6 text-left shadow-sm active:scale-95 transition-all">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 ${ch.iconBg} rounded-2xl flex items-center justify-center text-2xl flex-shrink-0">${ch.icon}</div>
                <div class="flex-grow min-w-0">
                    <p class="text-[10px] font-black ${ch.accentText} uppercase tracking-widest mb-0.5">${ch.label}</p>
                    <h2 class="text-base font-black text-slate-900 leading-snug">${ch.title}</h2>
                    <p class="text-sm text-slate-400 font-medium mt-0.5">共 <span class="text-slate-700 font-black">${ch.questions.length}</span> 題</p>
                </div>
                <svg class="w-5 h-5 text-slate-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                </svg>
            </div>
        </button>`).join('');
}

function showHub() { renderHub(); showView('hubView'); }

function selectChapter(idx) {
    chapterIdx = idx;
    const ch = CHAPTERS[idx];
    const iconEl = document.getElementById('startIcon');
    iconEl.textContent = ch.icon;
    iconEl.className = `w-20 h-20 ${ch.iconBg} rounded-full flex items-center justify-center text-4xl`;
    const subjEl = document.getElementById('startSubject');
    subjEl.textContent = ch.subject;
    subjEl.className = `text-xs font-black ${ch.accentText} uppercase tracking-widest mb-2`;
    document.getElementById('startTitle').textContent = ch.title;
    document.getElementById('startCount').textContent = ch.questions.length;
    document.querySelector('input[name="mode"][value="practice"]').checked = true;
    showView('startView');
}

// ─── Start ────────────────────────────────────────────────────────────────────
function startQuiz() {
    mode            = document.querySelector('input[name="mode"]:checked').value;
    activeQuestions = null;
    answers         = new Array(currentQuestions().length).fill(null);
    current         = 0;
    showView('quizView');
    render();
}

// ─── Render question ──────────────────────────────────────────────────────────
function render() {
    const qs    = currentQuestions();
    const q     = qs[current];
    const total = qs.length;
    const pct   = ((current + 1) / total * 100).toFixed(1);

    document.getElementById('qCounter').innerText    = `${current + 1} / ${total}`;
    document.getElementById('qProgress').style.width = pct + '%';
    updateScoreChip();

    const userAns    = answers[current];
    const answered   = userAns !== null;
    const isPractice = mode === 'practice';

    const optsHtml = q.opts.map((opt, i) => {
        let cls = 'option-btn w-full text-left p-4 bg-white border-2 border-slate-200 rounded-2xl font-bold text-sm shadow-sm flex items-center gap-3';
        if (answered && isPractice) {
            if (i === q.ans)        cls += ' opt-correct';
            else if (i === userAns) cls += ' opt-wrong';
        } else if (answered && !isPractice) {
            if (i === userAns) cls += ' opt-selected';
        }
        const num = ['①','②','③','④'][i];
        return `<button ${answered ? 'disabled' : ''} onclick="pick(${i})" class="${cls}">
            <span class="text-base flex-shrink-0">${num}</span>
            <span>${opt}</span>
        </button>`;
    }).join('');

    let feedbackHtml = '';
    if (answered && isPractice) {
        const ok = userAns === q.ans;
        const expl = EXPLANATIONS[chapterIdx + '_' + q.no];
        const explHtml = expl ? `<p class="text-xs text-slate-600 mt-2 pt-2 border-t border-current border-opacity-20 leading-relaxed">💡 ${expl}</p>` : '';
        feedbackHtml = `<div class="p-4 rounded-2xl ${ok ? 'bg-emerald-50 border border-emerald-200' : 'bg-red-50 border border-red-200'}">
            <p class="font-black text-sm ${ok ? 'text-emerald-700' : 'text-red-700'}">
                ${ok ? '✓ 答對了！' : `✗ 答錯了，正確答案是 ${['①','②','③','④'][q.ans]} ${q.opts[q.ans]}`}
            </p>
            ${explHtml}
        </div>`;
    }

    const isLast  = current === total - 1;
    const backBtn = current > 0
        ? `<button onclick="prev()" class="py-4 px-5 bg-slate-100 text-slate-700 font-black rounded-2xl active:scale-95 transition-all text-base flex-shrink-0">← 上一題</button>`
        : '';
    const nextBtn = answered
        ? `<button onclick="${isLast ? 'showResults()' : 'next()'}"
               class="py-4 bg-slate-900 text-white font-black rounded-2xl shadow-lg active:scale-95 transition-all text-base flex-grow">
               ${isLast ? '查看結果' : '下一題 →'}
           </button>`
        : '';
    const navHtml = (backBtn || nextBtn)
        ? `<div class="flex gap-3">${backBtn}${nextBtn}</div>`
        : '';

    const chartHtml = q.chart ? `<div class="my-2">${CHARTS[q.chart]}</div>` : '';
    document.getElementById('qBody').innerHTML = `
    <div class="animate-in flex flex-col gap-4">
        <div>
            <p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-2">第 ${current + 1} 題・題號 ${q.no}</p>
            ${chartHtml}
            <p class="text-base font-black text-slate-900 leading-relaxed">${q.q}</p>
        </div>
        <div class="flex flex-col gap-2">${optsHtml}</div>
        ${feedbackHtml}
        ${navHtml}
    </div>`;
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function pick(i) {
    if (answers[current] !== null) return;
    answers[current] = i;
    updateScoreChip();
    render();
}

function next() {
    if (current < currentQuestions().length - 1) { current++; render(); }
    else showResults();
}

function prev() {
    if (current > 0) { current--; render(); }
}

function confirmExit() {
    if (confirm('確定要退出？')) showView('startView');
}

function retryQuiz() { startQuiz(); }

function retryWrong() {
    const qs   = currentQuestions();
    const wrong = qs.filter((q, i) => answers[i] !== q.ans);
    if (wrong.length === 0) return;
    activeQuestions = wrong;
    answers         = new Array(wrong.length).fill(null);
    current         = 0;
    showView('quizView');
    render();
}

// ─── Score ────────────────────────────────────────────────────────────────────
function calcScore() {
    return answers.reduce((s, a, i) => (a !== null && a === currentQuestions()[i].ans) ? s + 1 : s, 0);
}

function updateScoreChip() {
    document.getElementById('scoreChip').innerText = `${calcScore()} 分`;
}

// ─── Results ──────────────────────────────────────────────────────────────────
function showResults() {
    const qs      = currentQuestions();
    const correct = calcScore();
    const total   = qs.length;
    const pct     = Math.round(correct / total * 100);

    document.getElementById('finalScore').innerText = `${correct} / ${total}`;
    document.getElementById('finalPct').innerText   = `正確率 ${pct}%`;
    document.getElementById('resultEmoji').innerText =
        pct >= 90 ? '🎉' : pct >= 70 ? '👏' : pct >= 50 ? '💪' : '📚';

    const reviewHtml = qs.map((q, i) => {
        const a       = answers[i];
        const ok      = a === q.ans;
        const bgCls   = ok ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200';
        const icon    = ok ? '✓' : '✗';
        const iconClr = ok ? 'text-emerald-600' : 'text-red-600';
        const userTxt = a !== null ? `${['①','②','③','④'][a]} ${q.opts[a]}` : '未作答';
        const ansTxt  = `${['①','②','③','④'][q.ans]} ${q.opts[q.ans]}`;
        return `<div class="p-4 border rounded-2xl ${bgCls}">
            <div class="flex items-start gap-3">
                <span class="font-black text-base ${iconClr} flex-shrink-0 mt-0.5">${icon}</span>
                <div class="flex-grow">
                    <p class="font-black text-[10px] text-slate-400 mb-1">題號 ${q.no}</p>
                    <p class="font-bold text-sm text-slate-800 mb-2 leading-snug">${q.q}</p>
                    <p class="text-xs text-slate-500">你選：<span class="font-bold text-slate-700">${userTxt}</span></p>
                    ${!ok ? `<p class="text-xs text-emerald-600 font-bold mt-0.5">正解：${ansTxt}</p>` : ''}
                    ${EXPLANATIONS[chapterIdx + '_' + q.no] ? `<p class="text-xs text-slate-500 mt-1.5 pt-1.5 border-t border-slate-200 leading-relaxed">💡 ${EXPLANATIONS[chapterIdx + '_' + q.no]}</p>` : ''}
                </div>
            </div>
        </div>`;
    }).join('');

    const wrongCount = qs.filter((q, i) => answers[i] !== q.ans).length;
    const wrongBtn = wrongCount > 0
        ? `<button onclick="retryWrong()" class="w-full py-4 bg-red-50 text-red-700 border-2 border-red-200 font-black rounded-2xl active:scale-95 transition-all text-sm">
               練習錯題（共 ${wrongCount} 題）
           </button>`
        : '';

    document.getElementById('resultBtns').innerHTML = `
        ${wrongBtn}
        <div class="grid grid-cols-2 gap-3">
            <button onclick="retryQuiz()" class="py-4 bg-slate-100 text-slate-700 font-black rounded-2xl active:scale-95 transition-all text-sm">再試一次</button>
            <button onclick="showHub()" class="py-4 bg-slate-900 text-white font-black rounded-2xl shadow-lg active:scale-95 transition-all text-sm">回首頁</button>
        </div>`;

    document.getElementById('reviewList').innerHTML = reviewHtml;
    showView('resultView');
    window.scrollTo(0, 0);
}

// ─── Browse ───────────────────────────────────────────────────────────────────
function showBrowse() {
    const ch = CHAPTERS[chapterIdx];
    document.getElementById('browseChapterTitle').textContent = ch.title;
    document.getElementById('browseChapterCount').textContent = `共 ${ch.questions.length} 題・顯示正確答案`;

    const labels = ['①','②','③','④'];
    const html = ch.questions.map((q, idx) => {
        const optsHtml = q.opts.map((opt, i) => {
            const isAns = i === q.ans;
            const cls = isAns
                ? 'flex items-start gap-2 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-800'
                : 'flex items-start gap-2 p-3 bg-white border border-slate-100 rounded-xl text-slate-500';
            return `<div class="${cls}">
                <span class="font-black text-sm flex-shrink-0 ${isAns ? 'text-emerald-600' : 'text-slate-400'}">${labels[i]}</span>
                <span class="text-sm font-${isAns ? 'bold' : 'medium'} leading-snug">${opt}</span>
                ${isAns ? '<span class="ml-auto flex-shrink-0 text-emerald-500 font-black text-sm">✓</span>' : ''}
            </div>`;
        }).join('');
        const qChartHtml = q.chart ? `<div class="my-1">${CHARTS[q.chart]}</div>` : '';
        return `<div class="bg-white border border-slate-100 rounded-3xl p-4 shadow-sm flex flex-col gap-3">
            <div>
                <p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1">Q${String(idx+1).padStart(2,'0')} · 題號 ${q.no}</p>
                ${qChartHtml}
                <p class="text-sm font-black text-slate-900 leading-relaxed">${q.q}</p>
            </div>
            <div class="flex flex-col gap-1.5">${optsHtml}</div>
        </div>`;
    }).join('');

    document.getElementById('browseBody').innerHTML = html;
    showView('browseView');
    window.scrollTo(0, 0);
}

// ─── View helpers ─────────────────────────────────────────────────────────────
const VIEWS = ['hubView','startView','quizView','resultView','browseView'];
function showView(id) {
    VIEWS.forEach(v => {
        document.getElementById(v).classList.add('hidden');
        document.getElementById(v).classList.remove('flex');
    });
    document.getElementById(id).classList.remove('hidden');
    document.getElementById(id).classList.add('flex');
}

renderHub();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>考題產生器（免費版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background: #f8fafc; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeUp 0.25s ease forwards; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.9s linear infinite; }

        .option-btn { transition: all 0.15s ease; }
        .option-btn:active:not(:disabled) { transform: scale(0.97); }
        .opt-correct  { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .opt-wrong    { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .opt-selected { background: #dbeafe !important; border-color: #3b82f6 !important; color: #1d4ed8 !important; }

        .progress-bar { transition: width 0.45s cubic-bezier(0.4,0,0.2,1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="file"] { display: none; }

        .drag-over { border-color: #3b82f6 !important; background: #eff6ff !important; }
    </style>
</head>
<body class="text-slate-800 font-sans">

<div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">

    <!-- ══════════════ SETUP ══════════════ -->
    <div id="setupView" class="flex flex-col gap-5 p-5 pt-10 pb-12">

        <div>
            <div class="inline-flex items-center gap-2 bg-emerald-50 border border-emerald-200 rounded-full px-3 py-1 mb-3">
                <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
                <span class="text-[10px] font-black text-emerald-700 uppercase tracking-widest">完全免費</span>
            </div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">AI 考題產生器</h1>
            <p class="text-slate-500 mt-1.5 text-sm font-medium leading-relaxed">
                上傳考卷截圖或影片<br>自動辨識選擇題並讓你立刻練習
            </p>
        </div>

        <!-- Drop Zone -->
        <div id="dropZone"
            class="bg-white rounded-3xl border-2 border-dashed border-slate-200 cursor-pointer transition-all"
            onclick="document.getElementById('fileInput').click()"
            ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
            <input type="file" id="fileInput" accept="image/*,video/*" multiple>
            <div class="p-8 flex flex-col items-center gap-3">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div class="text-center">
                    <p class="font-black text-slate-700">點擊上傳 或 拖曳到此</p>
                    <p class="text-xs text-slate-400 mt-1">支援 JPG、PNG、HEIC、MP4、MOV 等</p>
                    <p class="text-xs text-slate-400 mt-0.5">建議圖片清晰、文字大、高對比</p>
                </div>
            </div>
        </div>

        <!-- File List -->
        <div id="fileList" class="hidden flex-col gap-2"></div>

        <!-- Error -->
        <div id="errBox" class="hidden bg-red-50 border border-red-200 rounded-2xl p-4">
            <p id="errMsg" class="text-sm font-bold text-red-700"></p>
        </div>

        <!-- Tip -->
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4">
            <p class="text-xs font-black text-amber-700 mb-1">使用小提示</p>
            <p class="text-xs text-amber-600 leading-relaxed">
                本工具在你的裝置上直接辨識文字，完全免費不需帳號。<br>
                首次使用會下載約 <b>23 MB</b> 的中文辨識資料（之後快取，無需重複下載）。
            </p>
        </div>

        <button onclick="startOCR()"
            class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all text-base">
            開始辨識考題
        </button>
    </div>


    <!-- ══════════════ PROCESSING ══════════════ -->
    <div id="processingView" class="hidden flex-col flex-grow items-center justify-center gap-5 p-8 text-center">
        <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center">
            <div class="w-10 h-10 border-[3px] border-blue-500 border-t-transparent rounded-full spinner"></div>
        </div>
        <div>
            <h2 class="text-xl font-black text-slate-900">辨識中…</h2>
            <p id="procStatus" class="text-slate-500 mt-2 text-sm font-medium max-w-xs">正在載入中文辨識資料</p>
        </div>
        <div class="w-full max-w-xs">
            <div class="w-full bg-slate-200 rounded-full h-2 mb-1">
                <div id="procBar" class="bg-blue-500 h-2 rounded-full progress-bar" style="width:0%"></div>
            </div>
            <p id="procPct" class="text-xs text-slate-400 font-bold text-right">0%</p>
        </div>
    </div>


    <!-- ══════════════ MANUAL EDIT ══════════════ -->
    <div id="editView" class="hidden flex-col gap-4 p-5 pt-8 pb-12">
        <div>
            <h2 class="text-xl font-black text-slate-900">確認辨識結果</h2>
            <p class="text-sm text-slate-400 mt-1">共辨識到 <span id="qCount" class="font-black text-slate-700">0</span> 題，可手動修正後開始練習</p>
        </div>
        <div id="editList" class="flex flex-col gap-4 overflow-y-auto no-scrollbar"></div>
        <div class="grid grid-cols-2 gap-3 pt-2 sticky bottom-4">
            <button onclick="showSetup()" class="py-4 bg-slate-100 text-slate-700 font-black rounded-2xl active:scale-95 transition-all text-sm">
                重新上傳
            </button>
            <button onclick="startQuiz()" class="py-4 bg-slate-900 text-white font-black rounded-2xl shadow-lg active:scale-95 transition-all text-sm">
                開始練習
            </button>
        </div>
    </div>


    <!-- ══════════════ QUIZ ══════════════ -->
    <div id="quizView" class="hidden flex-col min-h-screen">
        <div class="bg-white px-5 pt-8 pb-4 border-b border-slate-100 sticky top-0 z-10">
            <div class="flex justify-between items-center mb-3">
                <button onclick="confirmExit()" class="p-2 bg-slate-50 rounded-full text-slate-400 active:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
                <span id="qCounter" class="text-sm font-black text-slate-500">1 / ?</span>
                <span id="scoreChip" class="text-sm font-black text-emerald-700 bg-emerald-50 border border-emerald-100 px-3 py-1 rounded-full">0 分</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-1.5">
                <div id="qProgress" class="bg-blue-500 h-1.5 rounded-full progress-bar" style="width:0%"></div>
            </div>
        </div>
        <div id="qBody" class="flex-grow p-5 pb-12 overflow-y-auto no-scrollbar"></div>
    </div>


    <!-- ══════════════ RESULTS ══════════════ -->
    <div id="resultView" class="hidden flex-col gap-5 p-5 pt-10 pb-12">
        <div class="text-center">
            <div id="resultEmoji" class="text-5xl mb-3">🎉</div>
            <h2 class="text-3xl font-black text-slate-900">測驗完成！</h2>
        </div>
        <div class="bg-blue-600 rounded-3xl p-6 text-white text-center shadow-xl">
            <p class="text-xs font-black uppercase tracking-widest opacity-70 mb-1">得分</p>
            <p id="finalScore" class="text-5xl font-black">0 / 0</p>
            <p id="finalPct" class="text-sm font-bold opacity-80 mt-2">0%</p>
        </div>
        <h3 class="font-black text-slate-400 text-[10px] uppercase tracking-widest">逐題回顧</h3>
        <div id="reviewList" class="flex flex-col gap-3"></div>
        <div class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="retryQuiz()" class="py-4 bg-slate-100 text-slate-700 font-black rounded-2xl active:scale-95 transition-all text-sm">再試一次</button>
            <button onclick="showSetup()" class="py-4 bg-slate-900 text-white font-black rounded-2xl shadow-lg active:scale-95 transition-all text-sm">上傳新圖片</button>
        </div>
    </div>

</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let selectedFiles = [];
let questions     = [];   // { q, opts[], ans (index or null) }
let answers       = [];
let currentQ      = 0;

// ─── Init ─────────────────────────────────────────────────────────────────────
window.onload = () => {
    document.getElementById('fileInput').addEventListener('change', e => {
        addFiles(Array.from(e.target.files));
        e.target.value = '';
    });
};

// ─── Drag & Drop ──────────────────────────────────────────────────────────────
function onDragOver(e) { e.preventDefault(); document.getElementById('dropZone').classList.add('drag-over'); }
function onDragLeave()  { document.getElementById('dropZone').classList.remove('drag-over'); }
function onDrop(e)      { e.preventDefault(); onDragLeave(); addFiles(Array.from(e.dataTransfer.files)); }

// ─── File management ──────────────────────────────────────────────────────────
function addFiles(files) {
    const valid = files.filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
    selectedFiles = [...selectedFiles, ...valid];
    renderFileList();
    hideErr();
}
function removeFile(i) { selectedFiles.splice(i, 1); renderFileList(); }

function renderFileList() {
    const el = document.getElementById('fileList');
    if (!selectedFiles.length) { el.classList.add('hidden'); el.innerHTML = ''; return; }
    el.classList.remove('hidden');
    el.innerHTML = selectedFiles.map((f, i) => {
        const vid  = f.type.startsWith('video/');
        const icon = vid
            ? `<svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>`
            : `<svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>`;
        return `<div class="bg-white rounded-2xl p-3 border border-slate-100 flex items-center gap-3 shadow-sm">
            <div class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center flex-shrink-0">${icon}</div>
            <div class="flex-grow min-w-0">
                <p class="text-sm font-bold text-slate-700 truncate">${f.name}</p>
                <p class="text-[10px] text-slate-400">${(f.size/1024/1024).toFixed(1)} MB · ${vid ? '影片' : '圖片'}</p>
            </div>
            <button onclick="removeFile(${i})" class="p-2 text-slate-300 active:text-red-400 transition flex-shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>`;
    }).join('');
}

function showErr(msg) { document.getElementById('errMsg').innerText = msg; document.getElementById('errBox').classList.remove('hidden'); }
function hideErr()    { document.getElementById('errBox').classList.add('hidden'); }

// ─── OCR Entry ────────────────────────────────────────────────────────────────
async function startOCR() {
    if (!selectedFiles.length) { showErr('請至少上傳一張圖片或影片'); return; }
    hideErr();
    showView('processingView');

    try {
        const worker = await Tesseract.createWorker('chi_tra+eng', 1, {
            logger: m => {
                if (m.status === 'loading tesseract core') setProc('載入辨識核心…', 5);
                if (m.status === 'loading language traineddata') setProc('下載中文辨識資料（約 23 MB，首次需等候）…', 10 + m.progress * 40);
                if (m.status === 'initializing api')  setProc('初始化辨識引擎…', 55);
                if (m.status === 'recognizing text')  setProc('辨識文字中…', 60 + m.progress * 35);
            }
        });

        let allText = '';
        for (let i = 0; i < selectedFiles.length; i++) {
            const f = selectedFiles[i];
            setProc(`處理 (${i+1}/${selectedFiles.length})：${f.name}`, 60);

            if (f.type.startsWith('video/')) {
                const frames = await extractFrames(f);
                for (const frameBlob of frames) {
                    const { data: { text } } = await worker.recognize(frameBlob);
                    allText += '\n' + text;
                }
            } else {
                const img = await normalizeImage(f);
                const { data: { text } } = await worker.recognize(img);
                allText += '\n' + text;
            }
        }

        await worker.terminate();
        setProc('解析題目…', 98);

        questions = parseQuestions(allText);

        if (!questions.length) {
            showErr('未辨識到選擇題。請確認圖片清晰，文字夠大，或嘗試截圖後重新上傳。');
            showView('setupView');
            return;
        }

        renderEditView();
        showView('editView');

    } catch (e) {
        console.error(e);
        showErr('辨識失敗：' + (e.message || '未知錯誤'));
        showView('setupView');
    }
}

function setProc(msg, pct) {
    document.getElementById('procStatus').innerText = msg;
    document.getElementById('procBar').style.width  = Math.min(pct, 99) + '%';
    document.getElementById('procPct').innerText    = Math.min(Math.round(pct), 99) + '%';
}

// ─── Image helpers ────────────────────────────────────────────────────────────
const SUPPORTED = ['image/jpeg','image/png','image/gif','image/webp'];

async function normalizeImage(file) {
    if (SUPPORTED.includes(file.type)) return file;
    return new Promise((res, rej) => {
        const img = new Image(), url = URL.createObjectURL(file);
        img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext('2d').drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
            c.toBlob(b => res(b), 'image/jpeg', 0.95);
        };
        img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('圖片無法載入')); };
        img.src = url;
    });
}

// ─── Video frame extraction ───────────────────────────────────────────────────
function extractFrames(videoFile) {
    return new Promise((resolve, reject) => {
        const video  = document.createElement('video');
        const canvas = document.createElement('canvas');
        const ctx    = canvas.getContext('2d');
        const url    = URL.createObjectURL(videoFile);
        video.src = url; video.muted = true; video.preload = 'metadata';

        video.addEventListener('loadedmetadata', () => {
            const MAX_W = 1000;
            canvas.width  = Math.min(video.videoWidth, MAX_W);
            canvas.height = Math.round(canvas.width * video.videoHeight / video.videoWidth);

            const dur = video.duration;
            const MAX_FRAMES = 12;
            const interval   = Math.max(2, dur / MAX_FRAMES);
            const times = [];
            for (let t = 0; t < dur; t += interval) times.push(Math.min(t, dur - 0.1));

            const blobs = []; let idx = 0;
            const next = () => { if (idx >= times.length) { URL.revokeObjectURL(url); resolve(blobs); return; } video.currentTime = times[idx]; };
            video.addEventListener('seeked', () => {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(b => { blobs.push(b); idx++; next(); }, 'image/jpeg', 0.85);
            });
            video.addEventListener('error', () => { URL.revokeObjectURL(url); reject(new Error('影片讀取失敗')); });
            next();
        });
        video.addEventListener('error', () => { URL.revokeObjectURL(url); reject(new Error('影片格式不支援')); });
    });
}

// ─── Text parsing ─────────────────────────────────────────────────────────────
function parseQuestions(rawText) {
    // Normalize
    const text = rawText
        .replace(/\r\n/g, '\n').replace(/\r/g, '\n')
        .replace(/　/g, ' ')        // full-width space
        .replace(/[①②③④]/g, (c) => (['①','②','③','④'].indexOf(c) + 1) + '.')  // circled numbers
        .replace(/（([1-4])）/g, '$1.')  // （1）→ 1.
        .replace(/\(([1-4])\)/g,  '$1.');  // (1) → 1.

    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

    const qs   = [];
    let qText  = '';
    let opts   = [];
    let ans    = null;

    const OPTION_RE  = /^([1-4])[.、．]\s*(.{1,60})/;
    const HEADER_RE  = /^\d{1,2}\s*(單選題|多選題|是非題)/;
    const CHECK_SYMS = ['✓','✔','☑','∨','√','v','V'];

    const saveQ = () => {
        if (qText.trim() && opts.length >= 2) {
            qs.push({ q: qText.trim(), opts: opts.slice(), ans });
        }
        qText = ''; opts = []; ans = null;
    };

    for (const line of lines) {
        if (HEADER_RE.test(line)) { saveQ(); continue; }

        const om = line.match(OPTION_RE);
        if (om) {
            const idx    = parseInt(om[1]) - 1;
            let   optTxt = om[2].trim();

            // Detect correct answer marker
            const hasCheck = CHECK_SYMS.some(s => optTxt.includes(s));
            if (hasCheck) {
                optTxt = optTxt.replace(/[✓✔☑∨√vV]/g, '').trim();
                ans = idx;
            }

            // If option index resets to 1 and we already have options → new question started
            if (idx === 0 && opts.length >= 2) { saveQ(); }

            opts[idx] = optTxt;
        } else {
            // Question text line
            // Skip very short non-question lines (scores, labels)
            if (line.length < 3) continue;
            if (/^\d+\s*分$/.test(line)) continue;          // "1分"
            if (/^測驗題|問答紀錄/.test(line)) continue;

            if (opts.length === 0) {
                qText += (qText ? '' : '') + line;
            }
        }
    }
    saveQ();

    // Deduplicate by first 20 chars of question
    const seen = new Set();
    return qs.filter(q => {
        const key = q.q.replace(/\s/g,'').slice(0,20);
        if (seen.has(key)) return false;
        seen.add(key); return true;
    });
}

// ─── Edit view (confirm/fix OCR results) ─────────────────────────────────────
function renderEditView() {
    document.getElementById('qCount').innerText = questions.length;
    document.getElementById('editList').innerHTML = questions.map((q, i) => `
    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-5 flex flex-col gap-3">
        <div class="flex justify-between items-start gap-2">
            <p class="text-[10px] font-black text-blue-500 uppercase tracking-widest">第 ${i+1} 題</p>
            <button onclick="removeQuestion(${i})" class="text-slate-300 active:text-red-400 transition p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <textarea id="qt_${i}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold resize-none outline-none focus:border-blue-400 transition" rows="3">${q.q}</textarea>
        ${q.opts.map((opt, j) => `
        <div class="flex items-center gap-2">
            <span class="text-xs font-black text-slate-400 flex-shrink-0 w-4">${j+1}.</span>
            <input type="text" id="opt_${i}_${j}" value="${esc(opt)}"
                class="flex-grow bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold outline-none focus:border-blue-400 transition">
            <label class="flex items-center gap-1 flex-shrink-0 cursor-pointer">
                <input type="radio" name="ans_${i}" value="${j}" ${q.ans === j ? 'checked' : ''} class="accent-emerald-500 w-3.5 h-3.5">
                <span class="text-[10px] font-black text-slate-400">正解</span>
            </label>
        </div>`).join('')}
    </div>`).join('');
}

function removeQuestion(i) {
    questions.splice(i, 1);
    if (!questions.length) { showSetup(); return; }
    renderEditView();
}

function collectEdits() {
    questions = questions.map((q, i) => {
        const qt   = document.getElementById(`qt_${i}`)?.value.trim() || q.q;
        const opts = q.opts.map((_, j) => document.getElementById(`opt_${i}_${j}`)?.value.trim() || q.opts[j]);
        const ansEl = document.querySelector(`input[name="ans_${i}"]:checked`);
        const ans  = ansEl ? parseInt(ansEl.value) : null;
        return { q: qt, opts, ans };
    }).filter(q => q.q && q.opts.length >= 2);
}

// ─── Quiz ─────────────────────────────────────────────────────────────────────
function startQuiz() {
    collectEdits();
    if (!questions.length) { showErr('沒有可練習的題目'); return; }
    answers  = new Array(questions.length).fill(null);
    currentQ = 0;
    showView('quizView');
    renderQ();
}

function renderQ() {
    const q     = questions[currentQ];
    const total = questions.length;
    const pct   = ((currentQ + 1) / total * 100).toFixed(1);

    document.getElementById('qCounter').innerText   = `${currentQ + 1} / ${total}`;
    document.getElementById('qProgress').style.width = pct + '%';
    updateScore();

    const userAns  = answers[currentQ];
    const answered = userAns !== null;

    const optsHtml = q.opts.map((opt, i) => {
        let cls = 'option-btn w-full text-left p-4 bg-white border-2 border-slate-200 rounded-2xl font-bold text-sm shadow-sm flex items-center gap-3';
        if (answered) {
            if (q.ans !== null && i === q.ans)       cls += ' opt-correct';
            else if (i === userAns) cls += (q.ans !== null ? ' opt-wrong' : ' opt-selected');
        }
        const num = ['①','②','③','④'][i];
        return `<button ${answered ? 'disabled' : ''} onclick="pick(${i})" class="${cls}">
            <span class="text-base flex-shrink-0">${num}</span><span>${esc(opt)}</span>
        </button>`;
    }).join('');

    let feedbackHtml = '';
    if (answered && q.ans !== null) {
        const ok = userAns === q.ans;
        feedbackHtml = `<div class="p-4 rounded-2xl ${ok ? 'bg-emerald-50 border border-emerald-200' : 'bg-red-50 border border-red-200'}">
            <p class="font-black text-sm ${ok ? 'text-emerald-700' : 'text-red-700'}">
                ${ok ? '✓ 答對了！' : `✗ 答錯了，正確答案是 ${['①','②','③','④'][q.ans]} ${esc(q.opts[q.ans])}`}
            </p>
        </div>`;
    } else if (answered) {
        feedbackHtml = `<div class="p-4 rounded-2xl bg-blue-50 border border-blue-200">
            <p class="font-bold text-sm text-blue-700">已選擇 ${['①','②','③','④'][userAns]}</p>
        </div>`;
    }

    const isLast = currentQ === total - 1;
    const navHtml = answered
        ? `<button onclick="${isLast ? 'showResults()' : 'nextQ()'}"
               class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl shadow-lg active:scale-95 transition-all text-base">
               ${isLast ? '查看結果' : '下一題 →'}
           </button>`
        : '';

    document.getElementById('qBody').innerHTML = `
    <div class="animate-in flex flex-col gap-4">
        <div>
            <p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-2">第 ${currentQ + 1} 題</p>
            <p class="text-base font-black text-slate-900 leading-relaxed">${esc(q.q)}</p>
        </div>
        <div class="flex flex-col gap-2">${optsHtml}</div>
        ${feedbackHtml}
        ${navHtml}
    </div>`;
}

function pick(i) {
    if (answers[currentQ] !== null) return;
    answers[currentQ] = i;
    updateScore();
    renderQ();
}

function nextQ() { if (currentQ < questions.length - 1) { currentQ++; renderQ(); } else showResults(); }

function updateScore() {
    const c = answers.reduce((s,a,i) => (a !== null && questions[i].ans !== null && a === questions[i].ans) ? s+1 : s, 0);
    document.getElementById('scoreChip').innerText = `${c} 分`;
}

function confirmExit() { if (confirm('確定要退出？')) showSetup(); }
function retryQuiz()   { startQuiz(); }

// ─── Results ──────────────────────────────────────────────────────────────────
function showResults() {
    const total    = questions.length;
    const scorable = questions.filter(q => q.ans !== null).length;
    const correct  = answers.reduce((s,a,i) => (a !== null && questions[i].ans !== null && a === questions[i].ans) ? s+1 : s, 0);
    const pct      = scorable > 0 ? Math.round(correct / scorable * 100) : null;

    document.getElementById('finalScore').innerText = scorable > 0 ? `${correct} / ${scorable}` : `${total} 題`;
    document.getElementById('finalPct').innerText   = pct !== null ? `正確率 ${pct}%` : '已完成所有題目';
    document.getElementById('resultEmoji').innerText = pct === null ? '✅' : pct >= 90 ? '🎉' : pct >= 70 ? '👏' : pct >= 50 ? '💪' : '📚';

    document.getElementById('reviewList').innerHTML = questions.map((q, i) => {
        const a  = answers[i];
        const ok = q.ans !== null && a === q.ans;
        const hasAns = q.ans !== null;
        const bg   = !hasAns ? 'bg-slate-50 border-slate-200' : ok ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200';
        const icon = !hasAns ? '○' : ok ? '✓' : '✗';
        const icl  = !hasAns ? 'text-slate-400' : ok ? 'text-emerald-600' : 'text-red-600';
        const userTxt = a !== null ? `${['①','②','③','④'][a]} ${esc(q.opts[a])}` : '未作答';
        const ansTxt  = hasAns ? `${['①','②','③','④'][q.ans]} ${esc(q.opts[q.ans])}` : '';
        const shortQ  = esc(q.q.length > 55 ? q.q.slice(0,55) + '…' : q.q);
        return `<div class="p-4 border rounded-2xl ${bg}">
            <div class="flex items-start gap-3">
                <span class="font-black text-base ${icl} flex-shrink-0 mt-0.5">${icon}</span>
                <div class="flex-grow">
                    <p class="font-bold text-sm text-slate-800 mb-1 leading-snug">${shortQ}</p>
                    <p class="text-xs text-slate-500">你選：<span class="font-bold text-slate-700">${userTxt}</span></p>
                    ${!ok && hasAns ? `<p class="text-xs text-emerald-600 font-bold mt-0.5">正解：${ansTxt}</p>` : ''}
                </div>
            </div>
        </div>`;
    }).join('');

    showView('resultView');
    window.scrollTo(0, 0);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
const VIEWS = ['setupView','processingView','editView','quizView','resultView'];
function showView(id) {
    VIEWS.forEach(v => { document.getElementById(v).classList.add('hidden'); document.getElementById(v).classList.remove('flex'); });
    document.getElementById(id).classList.remove('hidden');
    document.getElementById(id).classList.add('flex');
}
function showSetup() {
    selectedFiles = []; questions = [];
    document.getElementById('fileList').innerHTML = '';
    document.getElementById('fileList').classList.add('hidden');
    document.getElementById('fileInput').value = '';
    hideErr(); showView('setupView'); window.scrollTo(0,0);
}
function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>

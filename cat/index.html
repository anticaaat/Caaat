<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="貓咪日記">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Caaat 貓咪日記</title>
<style>
:root{
  color-scheme:light;
  --bg:#f2f2f7;
  --text:#1c1c1e; --text2:#6c6c70; --text3:#a1a1a6;
  --accent:#007aff; --accent-ink:#ffffff;
  --glass:rgba(255,255,255,.56); --glass-strong:rgba(255,255,255,.80);
  --glass-border:rgba(255,255,255,.85); --glass-edge:rgba(255,255,255,.95);
  --hair:rgba(60,60,67,.12); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --seg-on:#ffffff;
  --shadow:0 12px 32px -14px rgba(25,35,80,.22),0 2px 6px -2px rgba(25,35,80,.06);
  --grid:rgba(60,60,67,.09); --tip:rgba(255,255,255,.9);
  --warn:#c25e00; --warn-bg:rgba(255,149,0,.13); --bad:#d70015; --bad-bg:rgba(255,59,48,.11);
  --good:#248a3d;
  /* 圖表分類色（已驗證色盲安全，依固定順序使用） */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s-other:#a1a1a6;
  --wall1:#c9d9ff; --wall2:#ffd6e5; --wall3:#d2f2e6; --wall4:#ffe8cc;
  --recap1:#ffffff; --recap2:#f3f4f9; --r-orange:#b45309; --r-blue:#1d4ed8; --r-green:#15803d;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#000000;
    --text:#f5f5f7; --text2:#98989f; --text3:#636366;
    --accent:#0a84ff;
    --glass:rgba(38,38,42,.52); --glass-strong:rgba(44,44,48,.82);
    --glass-border:rgba(255,255,255,.10); --glass-edge:rgba(255,255,255,.16);
    --hair:rgba(255,255,255,.10); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --seg-on:#636366;
    --shadow:0 12px 32px -14px rgba(0,0,0,.7),0 2px 6px -2px rgba(0,0,0,.4);
    --grid:rgba(255,255,255,.08); --tip:rgba(58,58,62,.92);
    --warn:#ffb340; --warn-bg:rgba(255,159,10,.16); --bad:#ff6961; --bad-bg:rgba(255,69,58,.16);
    --good:#30d158;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s-other:#636366;
    --wall1:#14254f; --wall2:#3b1630; --wall3:#0c3328; --wall4:#3a2508;
    --recap1:#1f1f22; --recap2:#141416; --r-orange:#fb923c; --r-blue:#7aa7ff; --r-green:#4ade80;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40% 35% at 12% 8%,var(--wall1),transparent 70%),
    radial-gradient(38% 30% at 92% 18%,var(--wall2),transparent 70%),
    radial-gradient(45% 35% at 80% 78%,var(--wall3),transparent 70%),
    radial-gradient(35% 30% at 10% 70%,var(--wall4),transparent 70%),
    var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
svg{display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:540px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 110px)}
.hide{display:none!important}

/* ---------- 液態玻璃 ---------- */
.glass{position:relative;background:var(--glass);border:1px solid var(--glass-border);border-radius:26px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(155deg,var(--glass-edge) 0%,transparent 28%,transparent 72%,rgba(255,255,255,.08) 100%);opacity:.55}
.glass>*{position:relative}

/* ---------- 標題 ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 4px 14px}
.head .sub{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.02em}
.head h1{margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.round svg{width:20px;height:20px}

.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cchip{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 4px;border-radius:999px;white-space:nowrap;font-weight:600;font-size:14px;flex:none}
.cchip.on{background:var(--text);color:var(--bg);border-color:transparent}
.cchip.on::before{display:none}
.cchip.add{padding:0 14px;color:var(--text2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--fill);display:inline-grid;place-items:center;font-size:17px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

/* ---------- 卡片 ---------- */
.card{padding:18px;margin-bottom:14px}
.ctitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.ctitle h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.ctitle .meta{font-size:13px;color:var(--text2)}
.label{font-size:13px;font-weight:600;color:var(--text2);margin:22px 6px 8px;letter-spacing:.01em}
.empty{text-align:center;color:var(--text3);padding:22px 0;font-size:14px}
.link{color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.link svg{width:14px;height:14px}

/* 個人檔案 */
.hero{padding:22px 18px 16px}
.hero .top{display:flex;gap:16px;align-items:center}
.big-av{width:78px;height:78px;border-radius:50%;flex:none;background:var(--fill);display:grid;place-items:center;font-size:40px;overflow:hidden;
  box-shadow:0 0 0 3px var(--glass-strong),0 8px 22px -6px rgba(0,0,0,.25)}
.big-av img{width:100%;height:100%;object-fit:cover}
.hero .name{font-size:24px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
.hero .sex{font-size:15px;color:var(--text2);font-weight:600}
.hero .meta{font-size:13.5px;color:var(--text2);margin-top:3px}
.hero .age{margin-top:6px;font-size:15px;font-weight:650}
.hero .age small{color:var(--text3);font-weight:500;font-size:12.5px;margin-left:4px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:14px;border-top:.5px solid var(--hair)}
.stats3>div{text-align:center}
.stats3>div+div{border-left:.5px solid var(--hair)}
.stats3 b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.stats3 b small{font-size:12px;font-weight:600;color:var(--text2);margin-left:2px}
.stats3 span{font-size:11.5px;color:var(--text2)}
.delta{font-size:11.5px;font-weight:600;margin-left:3px}

/* 圖示方塊（iOS 設定風） */
.ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;background:var(--c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.ti svg{width:19px;height:19px}

/* 狀態方塊 */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{padding:13px 13px 12px;border-radius:20px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px}
.tile .t{font-size:12.5px;color:var(--text2);font-weight:500}
.tile .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:1px}
.tile .d{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tile.warn .v{color:var(--warn)}
.tile .row1{display:flex;justify-content:space-between;align-items:flex-start}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}

/* 清單（iOS 分組列表） */
.group{padding:4px 0;margin-bottom:14px;border-radius:22px}
.row{display:flex;gap:12px;align-items:center;padding:11px 16px;width:100%;text-align:left;position:relative}
.row+.row::after{content:"";position:absolute;top:0;left:62px;right:0;border-top:.5px solid var(--hair)}
.row.noicon+.row.noicon::after{left:16px}
.row .main{flex:1;min-width:0}
.row .title{font-weight:600;font-size:15.5px}
.row .title small{font-weight:500;color:var(--text3);font-size:12.5px;margin-left:4px}
.row .desc{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .right{text-align:right;font-size:12.5px;color:var(--text3);flex:none}
.row .right b{display:block;color:var(--text);font-size:14.5px;font-weight:600}
.row .chev{color:var(--text3);width:14px;height:14px;flex:none}
.rem .when{font-size:13px;font-weight:700;flex:none}
.rem.over .when{color:var(--bad)} .rem.soon .when{color:var(--warn)}
.dayhead{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text2);margin:18px 8px 8px}

/* 篩選 chip */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px}
.fchip.on{background:var(--text);color:var(--bg)}
.fchip.on::before{display:none}
.fchip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* 分段控制 */
.segc{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:0}
.segc button{padding:5px 11px;font-size:12.5px;font-weight:600;border-radius:7px;color:var(--text);white-space:nowrap}
.segc button.on{background:var(--seg-on);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* ---------- 圖表 ---------- */
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--text3);font-size:10px;font-family:inherit}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .dlabel{fill:var(--text);font-size:11px;font-weight:700}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--tip);color:var(--text);padding:6px 10px;border-radius:12px;font-size:11.5px;
  white-space:nowrap;box-shadow:0 8px 20px -6px rgba(0,0,0,.25);opacity:0;transition:opacity .12s;transform:translate(-50%,calc(-100% - 12px));
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:.5px solid var(--hair);color:var(--text2)}
.tip b{display:block;color:var(--text);font-size:14px;font-weight:700}
.tip.show{opacity:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--fill2);border-radius:14px;padding:10px 12px}
.kpi span{font-size:11.5px;color:var(--text2);display:block}
.kpi b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-wrap .chart{width:46%;flex:none;max-width:200px}
.legend{flex:1;min-width:0}
.legend button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 4px;border-radius:8px;font-size:13.5px;text-align:left}
.legend button.dim{opacity:.4}
.legend .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.legend .nm{flex:1;white-space:nowrap}
.legend .am{font-weight:600;min-width:56px;text-align:right}
.legend .pc{color:var(--text3);font-size:12px;width:36px;text-align:right}
.hbar{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13.5px}
.hbar .lab{width:84px;flex:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hbar .track{flex:1;height:8px;border-radius:4px;background:var(--fill2);overflow:hidden}
.hbar .fill{height:100%;border-radius:4px;background:var(--s1)}
.hbar .amt{width:58px;text-align:right;font-weight:600;flex:none}

/* ---------- 回顧卡 ---------- */
.recap{border-radius:30px;padding:22px 18px 18px;background:linear-gradient(180deg,var(--recap1),var(--recap2));box-shadow:var(--shadow);border:1px solid var(--glass-border);margin-bottom:14px}
.recap .hd{display:flex;justify-content:space-between;align-items:center}
.recap .logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.recap .logo svg{width:18px;height:18px}
.recap .yr{font-size:12px;color:var(--text2);font-weight:600}
.avs{display:flex;flex-wrap:wrap;justify-content:center;max-width:220px;margin:18px auto 6px}
.avs .a{width:64px;height:64px;border-radius:50%;border:3px solid var(--recap1);margin:-4px -4px;background:var(--fill);display:grid;place-items:center;font-size:32px;overflow:hidden}
.avs .a img{width:100%;height:100%;object-fit:cover}
.recap .names{text-align:center;font-size:13px;color:var(--text2);font-weight:600;margin-top:10px}
.recap .daysline{text-align:center;margin-top:4px;font-weight:700;font-size:15px}
.recap .daysline .n{font-size:60px;font-weight:800;letter-spacing:-.04em;margin:0 6px}
.recap .since{text-align:center;font-size:12.5px;color:var(--text3);margin-top:-6px}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.r3 div{border:1px solid var(--hair);border-radius:18px;text-align:center;padding:13px 4px}
.r3 b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em}
.r3 small{font-size:11.5px;color:var(--text2);font-weight:600}
.rbar{border-radius:18px;padding:14px 16px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;background:var(--fill2)}
.rbar .l b{font-size:14px;display:block}
.rbar .l small{font-size:11.5px;color:var(--text2)}
.rbar .r{font-weight:800;letter-spacing:-.02em}
.c-orange{color:var(--r-orange)} .c-green{color:var(--r-green)} .c-blue{color:var(--r-blue)}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 18px;border-radius:16px;font-weight:650;font-size:16px;background:var(--accent);color:#fff;width:100%}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn-row{display:flex;gap:10px;margin-top:14px}

/* ---------- 底部導覽（浮動玻璃） ---------- */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 12px);z-index:20;pointer-events:none}
.dock .in{max-width:540px;margin:0 auto;padding:0 16px;display:flex;gap:10px;align-items:center}
.tabs{flex:1;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;border-radius:999px;pointer-events:auto;background:var(--glass-strong)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--text2);padding:6px 0 5px;border-radius:999px;transition:background .2s,color .2s}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent);background:var(--fill)}
.fab{width:62px;height:62px;border-radius:50%;pointer-events:auto;display:grid;place-items:center;color:#fff;flex:none;
  background:radial-gradient(120% 120% at 30% 15%,rgba(255,255,255,.45),transparent 45%),var(--accent);
  box-shadow:0 10px 24px -6px color-mix(in srgb,var(--accent) 60%,transparent),inset 0 1px 1px rgba(255,255,255,.5),inset 0 -2px 6px rgba(0,0,0,.12)}
.fab svg{width:26px;height:26px}

/* ---------- 底部表單 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{width:100%;max-width:540px;border-radius:30px 30px 0 0;max-height:92vh;overflow-y:auto;padding:8px 18px calc(var(--safe-b) + 20px);
  animation:up .28s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain;background:var(--glass-strong);border-bottom:0;
  -webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%)}
@keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 14px}
.sheet h2{margin:0 0 16px;font-size:21px;font-weight:750;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.types button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text2)}
.types .ti{width:56px;height:56px;border-radius:17px}
.types .ti svg{width:26px;height:26px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;color:var(--text2);font-weight:600;margin:0 4px 6px}
.field input,.field select,.field textarea{width:100%;height:46px;padding:0 14px;border:0;border-radius:13px;background:var(--fill);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 2px var(--accent)}
.field textarea{height:auto;min-height:76px;padding:12px 14px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts button{height:34px;padding:0 13px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600}
.opts button.on{background:var(--accent);color:#fff}
.photo-pick{display:flex;align-items:center;gap:14px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin:0 6px 10px}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translate(-50%,10px);background:var(--glass-strong);color:var(--text);padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:600;z-index:60;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="sub" id="headSub"></div><h1 id="headTitle">今天</h1></div>
    <button class="round glass" id="gear" aria-label="設定"></button>
  </div>
  <div class="cats" id="catSwitch"></div>
  <section id="view-home"></section>
  <section id="view-records" class="hide"></section>
  <section id="view-charts" class="hide"></section>
  <section id="view-recap" class="hide"></section>
  <section id="view-settings" class="hide"></section>
</div>

<div class="dock"><div class="in">
  <nav class="tabs glass" id="tabs">
    <button data-view="home" class="on"></button>
    <button data-view="records"></button>
    <button data-view="charts"></button>
    <button data-view="recap"></button>
  </nav>
  <button class="fab" id="fab" aria-label="新增紀錄"></button>
</div></div>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 圖示（線條風） ================= */

/* ================= 日期 ================= */
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function nowTime(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function toUTC(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function fromUTC(t){const d=new Date(t);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
function addDays(s,n){return fromUTC(toUTC(s)+n*864e5)}
function diffDays(a,b){return Math.round((toUTC(b)-toUTC(a))/864e5)}
function fmtDate(s){return s?s.replace(/-/g,'.'):''}
function fmtShort(s){const [,m,d]=s.split('-');return `${+m}/${+d}`}
function fmtLong(s){const [y,m,d]=s.split('-');return `${y}年${+m}月${+d}日`}
function weekday(s){return '週'+'日一二三四五六'[new Date(toUTC(s)).getUTCDay()]}
function relDays(n){
  if(n===0)return '今天'; if(n===1)return '昨天'; if(n===2)return '前天';
  if(n<0)return `${-n} 天後`; if(n<30)return `${n} 天前`; if(n<365)return `${Math.floor(n/30)} 個月前`;
  return `${Math.floor(n/365)} 年前`;
}
function ageParts(birth){
  const t=todayStr(); if(!birth||birth>t)return null;
  let [by,bm,bd]=birth.split('-').map(Number),[ty,tm,td]=t.split('-').map(Number);
  let y=ty-by,m=tm-bm,d=td-bd;
  if(d<0){m--;d+=new Date(ty,tm-1,0).getDate()} if(m<0){y--;m+=12}
  return {y,m,d,total:diffDays(birth,t)};
}
function ageText(birth){const a=ageParts(birth);if(!a)return '';if(a.y===0&&a.m===0)return `${a.d} 天大`;if(a.y===0)return `${a.m} 個月 ${a.d} 天`;return `${a.y} 歲 ${a.m} 個月`}
function humanAge(birth){
  const a=ageParts(birth); if(!a)return null; const yrs=a.total/365.25; let h;
  if(yrs<=1){const tbl=[[0,0],[1,1],[2,2],[3,4],[4,6],[6,10],[8,13],[12,15]],mo=yrs*12;
    for(let i=1;i<tbl.length;i++){if(mo<=tbl[i][0]){const [m0,h0]=tbl[i-1],[m1,h1]=tbl[i];h=h0+(h1-h0)*(mo-m0)/(m1-m0);break}}}
  else if(yrs<=2)h=15+(yrs-1)*9; else h=24+(yrs-2)*4;
  return Math.round(h);
}
function nextBirthday(b){const t=todayStr(),y=+t.slice(0,4);let [,m,d]=b.split('-');if(m==='02'&&d==='29')d='28';let nb=`${y}-${m}-${d}`;if(nb<t)nb=`${y+1}-${m}-${d}`;return diffDays(t,nb)}

function sortRecs(a){return a.sort((x,y)=>(y.date+(y.time||'')).localeCompare(x.date+(x.time||'')))}

function lastOf(type,catId,pred){return recsOf(catId).find(r=>r.type===type&&(!pred||pred(r)))}
function recSummary(r){
  const T=TYPES[r.type],parts=[]; if(!T)return '';
  if(r.type==='weight'&&r.kg)parts.push(`${r.kg} kg`);
  for(const f of T.fields){if(f.k==='kg')continue;const v=r[f.k];if(!v)continue;
    if(f.k==='next')parts.push(`下次 ${fmtShort(v)}`); else if(f.k==='minutes')parts.push(`${v} 分鐘`); else parts.push(v)}
  if(r.note)parts.push(r.note);
  return parts.join(' · ');
}

/* ================= 圖表引擎 ================= */
let CID=0; const BINDS=[];
function flushCharts(){while(BINDS.length){const [id,fn]=BINDS.shift();const el=document.getElementById(id);if(el)fn(el)}}
function niceTicks(mn,mx,count=4){
  const span=mx-mn||1, raw=span/count, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(s=>s*mag).find(s=>span/s<=count)||raw;
  const lo=Math.floor(mn/step)*step, hi=Math.ceil(mx/step)*step, out=[];
  for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(6));
  return out;
}
function monotonePath(P){
  const n=P.length; if(n===1)return `M${P[0][0]},${P[0][1]}`;
  const dx=[],m=[],t=[];
  for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];m[i]=(P[i+1][1]-P[i][1])/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];
  for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=t[i+1]=0;continue}const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}
  let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${(P[i][0]+h).toFixed(1)},${(P[i][1]+t[i]*h).toFixed(1)} ${(P[i+1][0]-h).toFixed(1)},${(P[i+1][1]-t[i+1]*h).toFixed(1)} ${P[i+1][0].toFixed(1)},${P[i+1][1].toFixed(1)}`}
  return d;
}
function tipPos(el,tip,svgEl,vx,vy,W,H){
  const r=svgEl.getBoundingClientRect(),er=el.getBoundingClientRect();
  let px=vx/W*r.width+(r.left-er.left), py=vy/H*r.height+(r.top-er.top);
  const half=tip.offsetWidth/2; px=Math.max(half,Math.min(er.width-half,px));
  tip.style.left=px+'px'; tip.style.top=py+'px'; tip.classList.add('show');
}
// 折線圖：pts=[{x:'YYYY-MM-DD',y:number}]
function lineChart(o){
  const id='ch'+(++CID), pts=o.pts, W=340, H=o.h||200, L=34, R=16, T=22, B=24;
  if(!pts.length)return `<div class="empty">${o.empty||'還沒有資料'}</div>`;
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys),mx=Math.max(...ys);
  const padv=Math.max((mx-mn)*.25,o.minPad||.2); const ticks=niceTicks(Math.max(0,mn-padv),mx+padv,3);
  mn=ticks[0]; mx=ticks[ticks.length-1];
  const d0=toUTC(o.from||pts[0].x), d1=toUTC(o.to||pts[pts.length-1].x), span=Math.max(d1-d0,1);
  const X=p=>pts.length===1&&!o.from?(L+W-R)/2:L+(toUTC(p.x)-d0)/span*(W-L-R);
  const Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const P=pts.map(p=>[X(p),Y(p.y)]);
  const line=monotonePath(P);
  const area=P.length>1?`${line}L${P[P.length-1][0].toFixed(1)},${H-B}L${P[0][0].toFixed(1)},${H-B}Z`:'';
  const grid=ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax num" x="${L-7}" y="${Y(v)+3.5}" text-anchor="end">${o.fmtAxis?o.fmtAxis(v):v}</text>`).join('');
  // x 軸：最多 5 個日期
  const nx=Math.min(5,pts.length), xl=[];
  if(o.from){for(let i=0;i<5;i++){const t=d0+span*i/4;xl.push(`<text class="ax" x="${L+(t-d0)/span*(W-L-R)}" y="${H-6}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${fmtShort(fromUTC(t))}</text>`)}}
  else for(let i=0;i<nx;i++){const k=nx===1?0:Math.round(i*(pts.length-1)/(nx-1));xl.push(`<text class="ax" x="${P[k][0]}" y="${H-6}" text-anchor="middle">${fmtShort(pts[k].x)}</text>`)}
  const last=P[P.length-1], lp=pts[pts.length-1];
  const dots=P.length<=24?P.map((p,i)=>i===P.length-1?'':`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--s1)" />`).join(''):'';
  const gid='g'+id;
  BINDS.push([id,el=>{
    const s=el.querySelector('svg'),tip=el.querySelector('.tip'),guide=el.querySelector('.guide'),hd=el.querySelector('.hdot');
    const move=e=>{const r=s.getBoundingClientRect();const vx=(e.clientX-r.left)/r.width*W;
      let k=0,best=1e9;P.forEach((p,i)=>{const dd=Math.abs(p[0]-vx);if(dd<best){best=dd;k=i}});
      guide.setAttribute('x1',P[k][0]);guide.setAttribute('x2',P[k][0]);guide.style.opacity=1;
      hd.setAttribute('cx',P[k][0]);hd.setAttribute('cy',P[k][1]);hd.style.opacity=1;
      tip.innerHTML=`${fmtLong(pts[k].x)}<b class="num">${o.fmt(pts[k].y)}</b>`;tipPos(el,tip,s,P[k][0],P[k][1],W,H)};
    const out=()=>{tip.classList.remove('show');guide.style.opacity=0;hd.style.opacity=0};
    s.addEventListener('pointermove',move);s.addEventListener('pointerdown',move);s.addEventListener('pointerleave',out);
  }]);
  return `<div class="chart" id="${id}" role="img" aria-label="${esc(o.aria||'折線圖')}">
   <svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--s1)" stop-opacity=".28"/><stop offset="1" stop-color="var(--s1)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${area?`<path d="${area}" fill="url(#${gid})"/>`:''}
    <path d="${line}" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--s1)" stroke="var(--glass-strong)" stroke-width="2"/>
    <text class="dlabel num" x="${Math.min(last[0],W-R)}" y="${last[1]-10}" text-anchor="${last[0]>W-60?'end':'middle'}">${o.fmt(lp.y)}</text>
    ${xl.join('')}
    <line class="guide" x1="0" x2="0" y1="${T-6}" y2="${H-B}" stroke="var(--text3)" stroke-width="1" stroke-dasharray="3 3" style="opacity:0"/>
    <circle class="hdot" r="5" fill="var(--s1)" stroke="var(--glass-strong)" stroke-width="2.5" style="opacity:0"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
   </svg><div class="tip"></div></div>`;
}

function barChart(o){
  const id='ch'+(++CID), it=o.items, W=340, H=o.h||170, L=30, R=6, T=22, B=24;
  const maxV=Math.max(...it.map(d=>d.value),0);
  if(!maxV)return `<div class="empty">${o.empty||'這段期間沒有資料'}</div>`;
  const ticks=niceTicks(0,maxV,3), top=ticks[ticks.length-1];
  const band=(W-L-R)/it.length, bw=Math.min(28,band-Math.max(2,band*.32));
  const Y=v=>T+(1-v/top)*(H-T-B), base=H-B;
  const grid=ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax num" x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">${o.fmtAxis?o.fmtAxis(v):v}</text>`).join('');
  const maxI=it.findIndex(d=>d.value===maxV);
  const step=Math.ceil(it.length/7);
  let bars='',labels='',hits='';
  it.forEach((d,i)=>{
    const x=L+band*i+(band-bw)/2, y=Y(d.value), h=base-y, r=Math.min(4,h,bw/2);
    if(d.value>0)bars+=`<path class="bar" data-i="${i}" d="M${x},${base}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${base}Z" fill="var(--s1)"/>`;
    else bars+=`<rect x="${x}" y="${base-1.5}" width="${bw}" height="1.5" rx=".75" fill="var(--grid)"/>`;
    if(i%step===0||i===it.length-1)labels+=`<text class="ax" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${d.label}</text>`;
    hits+=`<rect data-i="${i}" x="${L+band*i}" y="${T-10}" width="${band}" height="${base-T+10}" fill="transparent"/>`;
  });
  const mx=L+band*maxI+band/2;
  BINDS.push([id,el=>{
    const s=el.querySelector('svg'),tip=el.querySelector('.tip'),bs=[...el.querySelectorAll('.bar')];
    const show=e=>{const t=e.target.closest('[data-i]');if(!t)return;const i=+t.dataset.i;
      bs.forEach(b=>b.style.opacity=+b.dataset.i===i?1:.35);
      tip.innerHTML=`${esc(it[i].tip||it[i].label)}<b class="num">${o.fmt(it[i].value)}</b>`;tipPos(el,tip,s,L+band*i+band/2,Y(it[i].value),W,H)};
    const out=()=>{tip.classList.remove('show');bs.forEach(b=>b.style.opacity=1)};
    s.addEventListener('pointermove',show);s.addEventListener('pointerdown',show);s.addEventListener('pointerleave',out);
  }]);
  return `<div class="chart" id="${id}" role="img" aria-label="${esc(o.aria||'直條圖')}"><svg viewBox="0 0 ${W} ${H}">${grid}${bars}
    <text class="dlabel num" x="${mx}" y="${Y(maxV)-7}" text-anchor="middle">${o.fmtShort?o.fmtShort(maxV):o.fmt(maxV)}</text>${labels}${hits}</svg><div class="tip"></div></div>`;
}
// 圓環圖：items=[{key,label,value,color}]
function donutChart(o){
  const id='ch'+(++CID), it=o.items.filter(d=>d.value>0), total=it.reduce((s,d)=>s+d.value,0);
  if(!total)return `<div class="empty">${o.empty||'沒有資料'}</div>`;
  const C=100, R1=92, R0=64, gap=it.length>1?.035:0;
  let a=-Math.PI/2, segs='';
  const pt=(r,ang)=>`${(C+r*Math.cos(ang)).toFixed(2)},${(C+r*Math.sin(ang)).toFixed(2)}`;
  it.forEach((d,i)=>{
    const sweep=d.value/total*Math.PI*2;
    if(it.length===1){segs+=`<circle cx="${C}" cy="${C}" r="${(R1+R0)/2}" fill="none" stroke="${d.color}" stroke-width="${R1-R0}" data-i="0" class="seg"/>`;return}
    const a0=a+gap/2, a1=a+sweep-gap/2, large=a1-a0>Math.PI?1:0;
    if(a1>a0)segs+=`<path class="seg" data-i="${i}" fill="${d.color}" d="M${pt(R1,a0)}A${R1},${R1} 0 ${large} 1 ${pt(R1,a1)}L${pt(R0,a1)}A${R0},${R0} 0 ${large} 0 ${pt(R0,a0)}Z"/>`;
    a+=sweep;
  });
  const legend=it.map((d,i)=>`<button data-i="${i}"><span class="sw" style="--c:${d.color}"></span><span class="nm">${esc(d.label)}</span><span class="am num">${o.fmt(d.value)}</span><span class="pc num">${Math.round(d.value/total*100)}%</span></button>`).join('');
  BINDS.push([id,el=>{
    const box=el.closest('.donut-wrap'), segEls=[...el.querySelectorAll('.seg')], lg=[...box.querySelectorAll('.legend button')];
    const cv=el.querySelector('.cv'), cl=el.querySelector('.cl'); let sel=-1;
    const pick=i=>{sel=sel===i?-1:i;
      segEls.forEach(s=>s.style.opacity=sel<0||+s.dataset.i===sel?1:.25); lg.forEach(b=>b.classList.toggle('dim',sel>=0&&+b.dataset.i!==sel));
      if(sel<0){cv.textContent=o.fmt(total);cl.textContent=o.centerLabel||'合計'}
      else{cv.textContent=o.fmt(it[sel].value);cl.textContent=`${it[sel].label} · ${Math.round(it[sel].value/total*100)}%`}};
    segEls.forEach(s=>s.addEventListener('click',()=>pick(+s.dataset.i))); lg.forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.i)));
  }]);
  return `<div class="donut-wrap"><div class="chart" id="${id}" role="img" aria-label="${esc(o.aria||'圓環圖')}"><svg viewBox="0 0 200 200">${segs}
    <text class="cv num" x="100" y="100" text-anchor="middle" style="fill:var(--text);font-size:24px;font-weight:800;letter-spacing:-.5px">${o.fmt(total)}</text>
    <text class="cl" x="100" y="122" text-anchor="middle" style="fill:var(--text2);font-size:12px;font-weight:600">${o.centerLabel||'合計'}</text></svg></div>
    <div class="legend">${legend}</div></div>`;
}

function reminders(cat){
  const t=todayStr(),out=[],ld=+DB.settings.litterDays||7;
  const lit=lastOf('litter',null,r=>r.kind!=='清理結塊'&&r.kind!=='補砂');
  if(!lit)out.push({type:'litter',text:'還沒有換貓砂的紀錄',when:'',cls:'soon',sort:0});
  else{const n=diffDays(lit.date,t);if(n>=ld-1)out.push({type:'litter',text:`${n} 天沒有全部換貓砂`,sub:`設定為每 ${ld} 天更換`,when:n>=ld?'該換了':'明天',cls:n>=ld?'over':'soon',sort:-n})}
  for(const type of ['vet','vaccine']){
    const seen=new Set();
    for(const r of recsOf(cat.id).filter(r=>r.type===type)){
      const key=type==='vaccine'?(r.kind||''):'vet'; if(seen.has(key))continue; seen.add(key);
      if(!r.next)continue; const n=diffDays(t,r.next); if(n>30)continue;
      out.push({type,text:type==='vet'?'回診':(r.kind||'疫苗驅蟲'),sub:`${fmtLong(r.next)}${type==='vet'&&r.clinic?' · '+r.clinic:''}`,
        when:n<0?`過期 ${-n} 天`:n===0?'今天':`${n} 天後`,cls:n<0?'over':n<=7?'soon':'',sort:n});
    }
  }
  const lw=lastOf('weight',cat.id); if(lw&&diffDays(lw.date,t)>=30)out.push({type:'weight',text:'超過一個月沒量體重',when:'',cls:'soon',sort:50});
  return out.sort((a,b)=>a.sort-b.sort);
}

/* ================= 圖表 ================= */
let WRANGE='90', ERANGE='month', DAILY='all';
const COST_GROUPS=[['food','飲食','var(--s1)'],['med','醫療','var(--s2)'],['litter','貓砂','var(--s3)'],['goods','用品玩具','var(--s4)'],['groom','美容清潔','var(--s5)'],['other','其他','var(--s-other)']];
function costGroup(r){
  if(['vet','vaccine','med'].includes(r.type))return 'med';
  if(r.type==='litter')return 'litter'; if(r.type==='groom')return 'groom';
  if(r.type==='expense'){const k=r.kind||'';
    if(/飼料|罐|零食|食|肉|奶/.test(k))return 'food'; if(/砂/.test(k))return 'litter';
    if(/玩具|用品|窩|抓板|碗/.test(k))return 'goods'; if(/醫|藥|保險|健檢/.test(k))return 'med'}
  return 'other';
}
function renderCharts(){
  const el=$('#view-charts'), cat=curCat();
  if(!cat){el.innerHTML='<div class="card glass empty">先建立貓咪檔案吧</div>';return}
  const t=todayStr();

  // 體重
  const all=weightSeries(cat.id);
  const from=WRANGE==='all'?null:addDays(t,-+WRANGE);
  const wp=from?all.filter(p=>p.x>=from):all;
  let k1='—',k2='—',k3='—';
  if(wp.length){const cur=wp[wp.length-1].y;k1=cur.toFixed(2);
    if(wp.length>1){const d=cur-wp[0].y;k2=(d>=0?'+':'−')+Math.abs(d).toFixed(2);
      const wk=Math.max(1,diffDays(wp[0].x,wp[wp.length-1].x))/7;k3=(d>=0?'+':'−')+Math.round(Math.abs(d)*1000/wk)}}

  // 開銷分佈
  const eFrom=ERANGE==='month'?t.slice(0,7)+'-01':ERANGE==='q'?addDays(t,-90):'0000';
  const costRecs=DB.records.filter(r=>+r.cost>0&&r.date>=eFrom&&r.date<=t);
  const sums={}; costRecs.forEach(r=>{const g=costGroup(r);sums[g]=(sums[g]||0)+ +r.cost});
  const donutItems=COST_GROUPS.map(([k,l,c])=>({key:k,label:l,color:c,value:sums[k]||0}));

  // 每月開銷（近 6 個月）
  const months=[]; {let [y,m]=t.split('-').map(Number);for(let i=0;i<6;i++){months.unshift(`${y}-${pad(m)}`);m--;if(!m){m=12;y--}}}
  const mItems=months.map(m=>({label:`${+m.slice(5)}月`,tip:`${m.slice(0,4)}年${+m.slice(5)}月`,value:DB.records.filter(r=>r.date.slice(0,7)===m).reduce((s,r)=>s+(+r.cost||0),0)}));

  // 每日紀錄（近 14 天）
  const days=[];for(let i=13;i>=0;i--)days.push(addDays(t,-i));
  const mine=recsOf(cat.id);
  const dItems=days.map(d=>{const rs=mine.filter(r=>r.date===d&&(DAILY==='all'||r.type===DAILY));
    const v=DAILY==='play'?rs.reduce((s,r)=>s+(+r.minutes||0),0):rs.length;return {label:fmtShort(d),tip:`${fmtShort(d)} ${weekday(d)}`,value:v}});
  const dUnit=DAILY==='play'?' 分鐘':' 次';

  // 次數排行
  const counts=Object.keys(TYPES).map(k=>({k,n:mine.filter(r=>r.type===k).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);

  el.innerHTML=`
  <div class="card glass">
    <div class="ctitle"><h3>體重</h3>${segc('w',WRANGE,[['30','1個月'],['90','3個月'],['all','全部']])}</div>
    <div class="kpis"><div class="kpi"><span>目前</span><b class="num">${k1}<small style="font-size:12px;color:var(--text2)"> kg</small></b></div>
      <div class="kpi"><span>期間變化</span><b class="num">${k2}<small style="font-size:12px;color:var(--text2)"> kg</small></b></div>
      <div class="kpi"><span>平均每週</span><b class="num">${k3}<small style="font-size:12px;color:var(--text2)"> g</small></b></div></div>
    ${lineChart({pts:wp,from:from&&wp.length>1?from:null,to:from&&wp.length>1?t:null,fmt:v=>v.toFixed(2)+' kg',fmtAxis:v=>v.toFixed(1),h:200,empty:'這段期間沒有體重紀錄',aria:'體重折線圖'})}
  </div>

  <div class="card glass">
    <div class="ctitle"><h3>開銷分佈</h3>${segc('e',ERANGE,[['month','本月'],['q','3個月'],['all','全部']])}</div>
    ${donutChart({items:donutItems,fmt:money,centerLabel:'合計',empty:'這段期間沒有填金額的紀錄',aria:'開銷分類圓環圖'})}
  </div>

  <div class="card glass">
    <div class="ctitle"><h3>每月開銷</h3><span class="meta">近 6 個月</span></div>
    ${barChart({items:mItems,fmt:money,fmtAxis:v=>v>=1000?(v/1000)+'k':v,empty:'還沒有開銷紀錄',aria:'每月開銷直條圖'})}
  </div>

  <div class="card glass">
    <div class="ctitle"><h3>每日紀錄</h3><span class="meta">近 14 天</span></div>
    <div style="margin:-4px 0 12px">${segc('d',DAILY,[['all','全部'],['feed','餵食'],['play','互動'],['water','喝水'],['poop','便便']])}</div>
    ${barChart({items:dItems,fmt:v=>v+dUnit,fmtShort:v=>String(v),empty:'近 14 天沒有這類紀錄',aria:'每日紀錄直條圖'})}
  </div>

  <div class="card glass">
    <div class="ctitle"><h3>紀錄次數</h3><span class="meta">${esc(cat.name)} · 全部</span></div>
    ${counts.length?counts.map(x=>`<div class="hbar"><span class="lab">${TYPES[x.k].name}</span><span class="track"><span class="fill" style="display:block;width:${(x.n/counts[0].n*100).toFixed(1)}%"></span></span><span class="amt num">${x.n} 次</span></div>`).join(''):'<div class="empty">還沒有紀錄</div>'}
  </div>`;
  bindSegc(el,{w:v=>{WRANGE=v;render()},e:v=>{ERANGE=v;render()},d:v=>{DAILY=v;render()}});
}

/* ================= 回顧卡 ================= */
function recapStats(){
  const t=todayStr();
  const dates=[DB.settings.startDate,...DB.cats.map(c=>c.adopt),...DB.records.map(r=>r.date)].filter(d=>d&&d<=t).sort();
  const start=dates[0]||t, days=diffDays(start,t)+1;
  const recs=DB.records.filter(r=>r.date>=start&&r.date<=t);
  return {start,days,recordedDays:new Set(recs.map(r=>r.date)).size,
    feed:recs.filter(r=>r.type==='feed').length, play:recs.filter(r=>r.type==='play').length,
    care:recs.length, cost:recs.reduce((s,r)=>s+(+r.cost||0),0)};
}
function renderRecap(){
  const el=$('#view-recap');
  if(!DB.cats.length){el.innerHTML='<div class="card glass empty">先建立貓咪檔案吧</div>';return}
  const s=recapStats(), cats=DB.cats.slice(0,9);
  el.innerHTML=`
  <div class="recap" id="recapCard">
    <div class="hd"><span class="logo">${svg('paw',2)}Caaat</span><span class="yr">${todayStr().slice(0,4)} 回顧</span></div>
    <div class="avs">${cats.map(c=>`<div class="a">${c.photo?`<img src="${c.photo}">`:(c.emoji||'🐱')}</div>`).join('')}</div>
    <div class="names">${DB.cats.map(c=>esc(c.name)).join(' · ')}</div>
    <div class="daysline">記錄貓咪的第<span class="n num" data-count="${s.days}">0</span>天</div>
    <div class="since">從 ${fmtDate(s.start)} 開始 · ${DB.cats.length} 隻貓</div>
    <div class="r3">
      <div><b class="c-orange num" data-count="${s.feed}">0</b><small>累積餵食</small></div>
      <div><b class="c-blue num" data-count="${s.play}">0</b><small>累積互動</small></div>
      <div><b class="c-green num" data-count="${s.care}">0</b><small>照護打卡</small></div>
    </div>
    <div class="rbar"><div class="l"><b>累積開銷</b><small>${fmtDate(s.start)} 至今</small></div>
      <div class="r c-blue num" style="font-size:28px" data-count="${Math.round(s.cost)}" data-money="1">$0</div></div>
    <div class="rbar"><div class="l"><b>累積記錄</b></div>
      <div class="r c-orange num" style="font-size:18px"><span data-count="${s.recordedDays}">0</span> / ${s.days} 天</div></div>
  </div>
  <div class="btn-row"><button class="btn ghost" id="replay">${svg('replay',2)}重播</button><button class="btn" id="saveImg">${svg('camera',2)}存成圖片</button></div>`;
  countUp(el); $('#replay').onclick=()=>countUp(el); $('#saveImg').onclick=saveRecapImage;
}
function countUp(root){
  const els=[...root.querySelectorAll('[data-count]')],dur=1600,t0=performance.now(),ease=p=>1-Math.pow(1-p,3);
  (function step(now){const p=Math.min(1,(now-t0)/dur);
    els.forEach(e=>{const v=Math.round(+e.dataset.count*ease(p));e.textContent=e.dataset.money?money(v):v.toLocaleString('en-US')});
    if(p<1)requestAnimationFrame(step)})(t0);
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function saveRecapImage(){
  const card=$('#recapCard');
  card.querySelectorAll('[data-count]').forEach(e=>{const v=+e.dataset.count;e.textContent=e.dataset.money?money(v):v.toLocaleString('en-US')});
  try{
    toast('產生圖片中…');
    if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    const canvas=await html2canvas(card,{backgroundColor:getComputedStyle(document.body).backgroundColor,scale:3,useCORS:true});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const file=new File([blob],`caaat-recap-${todayStr()}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'貓咪回顧'});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('已下載圖片')}
  }catch(e){if(e&&e.name!=='AbortError')toast('無法產生圖片，可以直接截圖')}
}

/* ================= 設定 ================= */
function renderSettings(){
  const el=$('#view-settings');
  el.innerHTML=`
  <div class="label" style="display:flex;justify-content:space-between"><span>我的貓咪</span><button class="link" id="addCat">新增</button></div>
  <div class="group glass">${DB.cats.length?DB.cats.map(c=>`<button class="row" data-edit="${c.id}">${avHTML(c,'av" style="width:36px;height:36px')}<div class="main"><div class="title">${esc(c.name)}</div><div class="desc">${c.birthday?ageText(c.birthday):'未填生日'}${c.breed?' · '+esc(c.breed):''}</div></div><span class="chev">${svg('chev',2.2)}</span></button>`).join(''):'<div class="empty">還沒有貓咪</div>'}</div>
  <div class="label">偏好</div>
  <div class="card glass" style="padding:16px 16px 2px">
    <div class="field"><label>多久要全部換一次貓砂（天）</label><input type="number" id="litterDays" min="1" value="${DB.settings.litterDays||7}"></div>
    <div class="field"><label>回顧卡起算日（留空會自動使用最早的日期）</label><input type="date" id="startDate" value="${DB.settings.startDate||''}"></div>
  </div>
  <div class="label">資料備份</div>
  <div class="card glass">
    <p style="font-size:13.5px;margin:0 0 4px;color:var(--text2);line-height:1.6">資料只存在這支手機的瀏覽器裡。換手機或清除瀏覽器資料前，記得先匯出備份。</p>
    <div class="btn-row"><button class="btn ghost" id="exp">${svg('down',2)}匯出</button><button class="btn ghost" id="imp">${svg('up',2)}匯入</button></div>
    <input type="file" id="impFile" accept="application/json,.json" class="hide">
    <p class="num" style="font-size:12px;margin:12px 0 0;color:var(--text3)">共 ${DB.records.length} 筆紀錄 · ${DB.cats.length} 隻貓</p>
  </div>
  <button class="btn danger" id="wipe" style="margin-top:6px">清除所有資料</button>`;
  $('#addCat').onclick=()=>openCatForm();
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openCatForm(catById(b.dataset.edit)));
  $('#litterDays').onchange=e=>{DB.settings.litterDays=Math.max(1,+e.target.value||7);save();toast('已儲存')};
  $('#startDate').onchange=e=>{DB.settings.startDate=e.target.value;save();toast('已儲存')};
  $('#exp').onclick=()=>{const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`caaat-backup-${todayStr()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
  $('#imp').onclick=()=>$('#impFile').click();
  $('#impFile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());if(!Array.isArray(d.cats)||!Array.isArray(d.records))throw 0;
      if(!confirm(`要用備份檔取代目前資料嗎？\n（備份：${d.cats.length} 隻貓、${d.records.length} 筆紀錄）`))return;
      DB=Object.assign(defaults(),d);save();render();toast('匯入完成')}catch(err){toast('檔案格式不正確')}
    e.target.value='';
  };
  $('#wipe').onclick=()=>{if(confirm('確定要刪除所有貓咪與紀錄嗎？此動作無法復原。')&&confirm('真的確定嗎？建議先匯出備份。')){DB=defaults();save();render();toast('已清除')}};
}

/* ================= 表單 ================= */
function openSheet(html){const sh=$('#sheet');sh.className='sheet glass';sh.innerHTML='<div class="grab"></div>'+html;$('#mask').classList.add('show');document.body.style.overflow='hidden';sh.scrollTop=0}
function closeSheet(){$('#mask').classList.remove('show');document.body.style.overflow=''}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeSheet()});

function openTypePicker(){
  openSheet(`<h2>新增紀錄</h2><div class="types">${Object.entries(TYPES).map(([k,T])=>`<button data-t="${k}">${ti(k)}${T.name}</button>`).join('')}</div>`);
  $('#sheet').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openRecordForm({type:b.dataset.t}));
}
function openRecordForm(rec){
  const isNew=!rec.id, T=TYPES[rec.type], cat=curCat();
  rec=Object.assign({date:todayStr(),time:nowTime(),catId:cat?cat.id:''},rec);
  const fieldHTML=f=>{
    const v=rec[f.k]??'';
    if(f.t==='seg')return `<div class="field"><label>${f.l}</label><div class="opts" data-seg="${f.k}">${f.opts.map(o=>`<button type="button" class="${v===o?'on':''}">${o}</button>`).join('')}</div>
      <input type="text" data-k="${f.k}" value="${esc(v)}" placeholder="或自行輸入" style="margin-top:8px"></div>`;
    return `<div class="field"><label>${f.l}${f.req?' *':''}</label><input type="${f.t}" data-k="${f.k}" value="${esc(v)}" ${f.step?`step="${f.step}"`:''} ${f.t==='number'?'inputmode="decimal"':''} placeholder="${f.ph||''}"></div>`;
  };
  openSheet(`<h2>${ti(rec.type)}${isNew?'':'編輯'}${T.name}</h2>
    ${DB.cats.length>1?`<div class="field"><label>哪一隻</label><div class="opts" id="catSeg">${DB.cats.map(c=>`<button type="button" data-c="${c.id}" class="${rec.catId===c.id?'on':''}">${esc(c.name)}</button>`).join('')}${rec.type==='litter'||rec.type==='expense'?`<button type="button" data-c="all" class="${rec.catId==='all'?'on':''}">全部</button>`:''}</div></div>`:''}
    <div class="grid2"><div class="field"><label>日期</label><input type="date" id="fDate" value="${rec.date}"></div>
    <div class="field"><label>時間</label><input type="time" id="fTime" value="${rec.time||''}"></div></div>
    ${T.fields.map(fieldHTML).join('')}
    ${T.cost?`<div class="field"><label>金額（元）${T.costReq?' *':''}</label><input type="number" inputmode="decimal" data-k="cost" value="${rec.cost??''}" placeholder="0"></div>`:''}
    <div class="field"><label>備註</label><textarea data-k="note" placeholder="想記下的事…">${esc(rec.note||'')}</textarea></div>
    <div class="btn-row">${isNew?'':'<button class="btn danger" id="del" style="flex:0 0 96px">刪除</button>'}<button class="btn" id="saveRec">儲存</button></div>`);
  const sh=$('#sheet');
  sh.querySelectorAll('[data-seg]').forEach(seg=>{
    const inp=sh.querySelector(`input[data-k="${seg.dataset.seg}"]`);
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{const on=!b.classList.contains('on');seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));if(on){b.classList.add('on');inp.value=b.textContent}else inp.value=''});
    inp.oninput=()=>seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.textContent===inp.value));
  });
  let catId=rec.catId;
  const cs=$('#catSeg'); if(cs)cs.querySelectorAll('button').forEach(b=>b.onclick=()=>{cs.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');catId=b.dataset.c});
  $('#saveRec').onclick=()=>{
    const out={id:rec.id||uid(),type:rec.type,catId,date:$('#fDate').value||todayStr(),time:$('#fTime').value};
    sh.querySelectorAll('[data-k]').forEach(i=>{const v=i.value.trim();if(v!=='')out[i.dataset.k]=i.type==='number'?+v:v});
    for(const f of T.fields)if(f.req&&out[f.k]==null)return toast(`請填寫${f.l}`);
    if(T.costReq&&!out.cost)return toast('請填寫金額');
    if(out.type==='weight'&&(out.kg<=0||out.kg>30))return toast('體重數字好像不太對');
    const i=DB.records.findIndex(r=>r.id===out.id); if(i>=0)DB.records[i]=out; else DB.records.push(out);
    save();closeSheet();render();toast(isNew?`已記錄${T.name}`:'已更新');
  };
  const del=$('#del'); if(del)del.onclick=()=>{if(!confirm('刪除這筆紀錄？'))return;DB.records=DB.records.filter(r=>r.id!==rec.id);save();closeSheet();render();toast('已刪除')};
}

const EMOJIS=['🐱','😺','🐈','🐈‍⬛','😸','😻','🦁','🐯'];
function openCatForm(cat){
  const isNew=!cat; cat=Object.assign({emoji:'🐱',gender:''},cat||{});
  let photo=cat.photo||'',emoji=cat.emoji,gender=cat.gender;
  openSheet(`<h2>${isNew?'新增貓咪':'編輯 '+esc(cat.name)}</h2>
    <div class="field photo-pick"><div class="big-av" id="pv" style="width:72px;height:72px;font-size:36px"></div>
      <div style="flex:1"><div style="display:flex;gap:8px;align-items:center"><button class="btn ghost" id="pickPhoto" style="width:auto;height:38px;font-size:14px;padding:0 14px">${svg('camera',2)}選擇照片</button>
      ${photo?'<button class="link" id="rmPhoto">移除</button>':''}</div>
      <div class="opts" id="emo" style="margin-top:8px;gap:4px">${EMOJIS.map(e=>`<button type="button" class="${emoji===e?'on':''}" style="padding:0 7px;font-size:18px;height:32px">${e}</button>`).join('')}</div></div>
      <input type="file" accept="image/*" id="photoFile" class="hide"></div>
    <div class="field"><label>名字 *</label><input id="cName" value="${esc(cat.name||'')}" placeholder="例如 麻糬"></div>
    <div class="field"><label>性別</label><div class="opts" id="gen"><button type="button" data-g="male" class="${gender==='male'?'on':''}">♂ 男生</button><button type="button" data-g="female" class="${gender==='female'?'on':''}">♀ 女生</button></div></div>
    <div class="grid2"><div class="field"><label>生日（或推估）</label><input type="date" id="cBirth" value="${cat.birthday||''}"></div>
    <div class="field"><label>到家日</label><input type="date" id="cAdopt" value="${cat.adopt||''}"></div></div>
    <div class="grid2"><div class="field"><label>品種</label><input id="cBreed" value="${esc(cat.breed||'')}" placeholder="例如 米克斯"></div>
    <div class="field"><label>毛色</label><input id="cColor" value="${esc(cat.color||'')}" placeholder="例如 橘白"></div></div>
    <div class="grid2"><div class="field"><label>是否結紮</label><select id="cNeuter"><option value="">未填</option><option ${cat.neuter==='已結紮'?'selected':''}>已結紮</option><option ${cat.neuter==='未結紮'?'selected':''}>未結紮</option></select></div>
    <div class="field"><label>晶片號碼</label><input id="cChip" value="${esc(cat.chip||'')}" inputmode="numeric"></div></div>
    <div class="field"><label>備註（過敏、個性…）</label><textarea id="cNote">${esc(cat.note||'')}</textarea></div>
    <div class="btn-row">${isNew?'':'<button class="btn danger" id="delCat" style="flex:0 0 96px">刪除</button>'}<button class="btn" id="saveCat">儲存</button></div>`);
  const pv=()=>{$('#pv').innerHTML=photo?`<img src="${photo}">`:emoji};pv();
  $('#pickPhoto').onclick=()=>$('#photoFile').click();
  const rm=$('#rmPhoto'); if(rm)rm.onclick=()=>{photo='';pv();rm.remove()};
  $('#photoFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photo=await resizeImage(f,360);pv()}catch(err){toast('讀取照片失敗')}};
  $('#emo').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#emo').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');emoji=b.textContent;pv()});
  $('#gen').querySelectorAll('button').forEach(b=>b.onclick=()=>{const on=!b.classList.contains('on');$('#gen').querySelectorAll('button').forEach(x=>x.classList.remove('on'));if(on){b.classList.add('on');gender=b.dataset.g}else gender=''});
  $('#saveCat').onclick=()=>{
    const name=$('#cName').value.trim(); if(!name)return toast('請輸入名字');
    const out=Object.assign(cat,{id:cat.id||uid(),name,photo,emoji,gender,birthday:$('#cBirth').value,adopt:$('#cAdopt').value,
      breed:$('#cBreed').value.trim(),color:$('#cColor').value.trim(),neuter:$('#cNeuter').value,chip:$('#cChip').value.trim(),note:$('#cNote').value.trim()});
    const i=DB.cats.findIndex(c=>c.id===out.id); if(i>=0)DB.cats[i]=out; else DB.cats.push(out);
    DB.current=out.id;save();closeSheet();render();toast(isNew?`歡迎 ${name}`:'已更新');
  };
  const dc=$('#delCat'); if(dc)dc.onclick=()=>{
    const n=DB.records.filter(r=>r.catId===cat.id).length;
    if(!confirm(`確定刪除 ${cat.name}？\n牠的 ${n} 筆紀錄也會一起刪除。`))return;
    DB.cats=DB.cats.filter(c=>c.id!==cat.id);DB.records=DB.records.filter(r=>r.catId!==cat.id);
    if(DB.current===cat.id)DB.current=DB.cats[0]?.id||null;save();closeSheet();render();toast('已刪除');
  };
}
function resizeImage(file,size){
  return new Promise((ok,no)=>{const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=size;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.82))};
    img.onerror=no;img.src=url});
}

render();
</script>

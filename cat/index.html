<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="貓咪日記">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="icon" href="icon-192.png?v=4">
<title>Caaat 貓咪日記</title>
<style>
:root{
  color-scheme:light;
  --bg:#f2f2f7;
  --text:#1c1c1e; --text2:#6c6c70; --text3:#a1a1a6;
  --accent:#007aff; --accent-ink:#ffffff;
  --glass:rgba(255,255,255,.56); --glass-card:rgba(255,255,255,.66); --glass-strong:rgba(255,255,255,.72);
  --lens-bg:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.12)); --lens-rest:rgba(118,118,128,.14);
  --sheet-bg:rgba(247,247,250,.97);
  --glass-border:rgba(255,255,255,.85); --glass-edge:rgba(255,255,255,.95);
  --hair:rgba(60,60,67,.12); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --seg-on:#ffffff;
  --shadow:0 12px 32px -14px rgba(25,35,80,.22),0 2px 6px -2px rgba(25,35,80,.06);
  --grid:rgba(60,60,67,.09); --tip:rgba(255,255,255,.9);
  --warn:#c25e00; --warn-bg:rgba(255,149,0,.13); --bad:#d70015; --bad-bg:rgba(255,59,48,.11);
  --good:#248a3d;
  /* 圖表分類色（已驗證色盲安全，依固定順序使用） */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s-other:#a1a1a6;
  --wall1:#c9d9ff; --wall2:#ffd6e5; --wall3:#d2f2e6; --wall4:#ffe8cc;
  --recap1:#ffffff; --recap2:#f3f4f9; --r-orange:#b45309; --r-blue:#1d4ed8; --r-green:#15803d;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#000000;
    --text:#f5f5f7; --text2:#98989f; --text3:#636366;
    --accent:#0a84ff;
    --glass:rgba(38,38,42,.52); --glass-card:rgba(36,36,40,.72); --glass-strong:rgba(44,44,48,.70);
    --lens-bg:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.06)); --lens-rest:rgba(255,255,255,.12);
    --sheet-bg:rgba(30,30,33,.97);
    --glass-border:rgba(255,255,255,.10); --glass-edge:rgba(255,255,255,.16);
    --hair:rgba(255,255,255,.10); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --seg-on:#636366;
    --shadow:0 12px 32px -14px rgba(0,0,0,.7),0 2px 6px -2px rgba(0,0,0,.4);
    --grid:rgba(255,255,255,.08); --tip:rgba(58,58,62,.92);
    --warn:#ffb340; --warn-bg:rgba(255,159,10,.16); --bad:#ff6961; --bad-bg:rgba(255,69,58,.16);
    --good:#30d158;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s-other:#636366;
    --wall1:#14254f; --wall2:#3b1630; --wall3:#0c3328; --wall4:#3a2508;
    --recap1:#1f1f22; --recap2:#141416; --r-orange:#fb923c; --r-blue:#7aa7ff; --r-green:#4ade80;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;transform:translateZ(0);
  background:
    radial-gradient(40% 35% at 12% 8%,var(--wall1),transparent 70%),
    radial-gradient(38% 30% at 92% 18%,var(--wall2),transparent 70%),
    radial-gradient(45% 35% at 80% 78%,var(--wall3),transparent 70%),
    radial-gradient(35% 30% at 10% 70%,var(--wall4),transparent 70%),
    var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
svg{display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:540px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 110px)}
.hide{display:none!important}

/* ---------- 液態玻璃 ---------- */
.glass{position:relative;background:var(--glass-card);border:1px solid var(--glass-border);border-radius:26px;box-shadow:var(--shadow)}
/* 浮在內容上面的元件才用真正的背景模糊（卡片下面只有靜態背景，用半透明就有相同效果，滑動更順） */
.float-glass{background:var(--glass-strong);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(155deg,var(--glass-edge) 0%,transparent 28%,transparent 72%,rgba(255,255,255,.08) 100%);opacity:.55}
.glass>*{position:relative}

/* ---------- 標題 ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 4px 14px}
.head .sub{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.02em}
.head h1{margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.round svg{width:20px;height:20px}

.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cchip{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 4px;border-radius:999px;white-space:nowrap;font-weight:600;font-size:14px;flex:none}
.cchip.on{background:var(--text);color:var(--bg);border-color:transparent}
.cchip.on::before{display:none}
.cchip.add{padding:0 14px;color:var(--text2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--fill);display:inline-grid;place-items:center;font-size:17px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

/* ---------- 卡片 ---------- */
.card{padding:18px;margin-bottom:14px}
.ctitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.ctitle h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.ctitle .meta{font-size:13px;color:var(--text2)}
.label{font-size:13px;font-weight:600;color:var(--text2);margin:22px 6px 8px;letter-spacing:.01em}
.empty{text-align:center;color:var(--text3);padding:22px 0;font-size:14px}
.link{color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.link svg{width:14px;height:14px}

/* 個人檔案 */
.hero{padding:22px 18px 16px}
.hero .top{display:flex;gap:16px;align-items:center}
.big-av{width:78px;height:78px;border-radius:50%;flex:none;background:var(--fill);display:grid;place-items:center;font-size:40px;overflow:hidden;
  box-shadow:0 0 0 3px var(--glass-strong),0 8px 22px -6px rgba(0,0,0,.25)}
.big-av img{width:100%;height:100%;object-fit:cover}
.hero .name{font-size:24px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
.sex{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;flex:none}
.sex svg{width:15px;height:15px}
.sex.male{color:#0a84ff;background:rgba(10,132,255,.13)} .sex.female{color:#ff2d55;background:rgba(255,45,85,.12)}
.hero .meta{font-size:13.5px;color:var(--text2);margin-top:3px}
.hero .age{margin-top:6px;font-size:15px;font-weight:650}
.hero .age small{color:var(--text3);font-weight:500;font-size:12.5px;margin-left:4px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:14px;border-top:.5px solid var(--hair)}
.stats3>div{text-align:center}
.stats3>div+div{border-left:.5px solid var(--hair)}
.stats3 b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.stats3 b small{font-size:12px;font-weight:600;color:var(--text2);margin-left:2px}
.stats3 span{font-size:11.5px;color:var(--text2)}
.delta{font-size:11.5px;font-weight:600;margin-left:3px}

/* 圖示方塊（iOS 設定風） */
.ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;background:var(--c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.ti svg{width:19px;height:19px}

/* 狀態方塊 */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{padding:13px 13px 12px;border-radius:20px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px}
.tile .t{font-size:12.5px;color:var(--text2);font-weight:500}
.tile .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:1px}
.tile .d{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tile.warn .v{color:var(--warn)}
.tile .row1{display:flex;justify-content:space-between;align-items:flex-start}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}

/* 清單（iOS 分組列表） */
.group{padding:4px 0;margin-bottom:14px;border-radius:22px}
.row{display:flex;gap:12px;align-items:center;padding:11px 16px;width:100%;text-align:left;position:relative}
.row+.row::after{content:"";position:absolute;top:0;left:62px;right:0;border-top:.5px solid var(--hair)}
.row.noicon+.row.noicon::after{left:16px}
.row .main{flex:1;min-width:0}
.row .title{font-weight:600;font-size:15.5px}
.row .title small{font-weight:500;color:var(--text3);font-size:12.5px;margin-left:4px}
.row .desc{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .right{text-align:right;font-size:12.5px;color:var(--text3);flex:none}
.row .right b{display:block;color:var(--text);font-size:14.5px;font-weight:600}
.row .chev{color:var(--text3);width:14px;height:14px;flex:none}
.rem .when{font-size:13px;font-weight:700;flex:none}
.rem.over .when{color:var(--bad)} .rem.soon .when{color:var(--warn)}
.dayhead{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text2);margin:18px 8px 8px}

/* 篩選 chip */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px}
.fchip.on{background:var(--text);color:var(--bg)}
.fchip.on::before{display:none}
.fchip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* 分段控制 */
.segc{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;touch-action:none;user-select:none;-webkit-user-select:none}
.segc button{position:relative;z-index:1;padding:5px 11px;font-size:12.5px;font-weight:600;border-radius:8px;color:var(--text2);white-space:nowrap;transition:color .2s}
.segc button.on{color:var(--text)}
.segc .lens{border-radius:8px}.segc .lens>i{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* 液態玻璃滑塊（可拖曳） */
.lens{position:absolute;top:0;left:0;height:100%;z-index:0;pointer-events:none;will-change:transform;contain:strict;
  transition:transform .45s cubic-bezier(.3,1.35,.5,1),opacity .2s}
.lens>i{position:absolute;inset:0;border-radius:inherit;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.lens>i::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .15s;
  background:var(--lens-bg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 2px 5px rgba(255,255,255,.55),inset 0 -3px 8px rgba(0,0,0,.07),0 6px 16px -6px rgba(0,0,0,.25)}
.lens.drag{z-index:2;contain:none}
.lens.drag>i{transform:scale(1.13)}
.lens.drag>i::after{opacity:1}

/* ---------- 圖表 ---------- */
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--text3);font-size:10px;font-family:inherit}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .dlabel{fill:var(--text);font-size:11px;font-weight:700}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--tip);color:var(--text);padding:6px 10px;border-radius:12px;font-size:11.5px;
  white-space:nowrap;box-shadow:0 8px 20px -6px rgba(0,0,0,.25);opacity:0;transition:opacity .12s;transform:translate(-50%,calc(-100% - 12px));
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:.5px solid var(--hair);color:var(--text2)}
.tip b{display:block;color:var(--text);font-size:14px;font-weight:700}
.tip.show{opacity:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--fill2);border-radius:14px;padding:10px 12px}
.kpi span{font-size:11.5px;color:var(--text2);display:block}
.kpi b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-wrap .chart{width:46%;flex:none;max-width:200px}
.legend{flex:1;min-width:0}
.legend button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 4px;border-radius:8px;font-size:13.5px;text-align:left}
.legend button.dim{opacity:.4}
.legend .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.legend .nm{flex:1;white-space:nowrap}
.legend .am{font-weight:600;min-width:56px;text-align:right}
.legend .pc{color:var(--text3);font-size:12px;width:36px;text-align:right}
.hbar{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13.5px}
.hbar .lab{width:84px;flex:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hbar .track{flex:1;height:8px;border-radius:4px;background:var(--fill2);overflow:hidden}
.hbar .fill{height:100%;border-radius:4px;background:var(--s1)}
.hbar .amt{width:58px;text-align:right;font-weight:600;flex:none}

/* ---------- 回顧卡 ---------- */
.recap{border-radius:30px;padding:22px 18px 18px;background:linear-gradient(180deg,var(--recap1),var(--recap2));box-shadow:var(--shadow);border:1px solid var(--glass-border);margin-bottom:14px}
.recap .hd{display:flex;justify-content:space-between;align-items:center}
.recap .logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.recap .logo svg{width:18px;height:18px}
.recap .yr{font-size:12px;color:var(--text2);font-weight:600}
.avs{display:flex;flex-wrap:wrap;justify-content:center;max-width:220px;margin:18px auto 6px}
.avs .a{width:64px;height:64px;border-radius:50%;border:3px solid var(--recap1);margin:-4px -4px;background:var(--fill);display:grid;place-items:center;font-size:32px;overflow:hidden}
.avs .a img{width:100%;height:100%;object-fit:cover}
.recap .names{text-align:center;font-size:13px;color:var(--text2);font-weight:600;margin-top:10px}
.recap .daysline{text-align:center;margin-top:4px;font-weight:700;font-size:15px}
.recap .daysline .n{font-size:60px;font-weight:800;letter-spacing:-.04em;margin:0 6px}
.recap .since{text-align:center;font-size:12.5px;color:var(--text3);margin-top:-6px}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.r3 div{border:1px solid var(--hair);border-radius:18px;text-align:center;padding:13px 4px}
.r3 b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em}
.r3 small{font-size:11.5px;color:var(--text2);font-weight:600}
.rbar{border-radius:18px;padding:14px 16px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;background:var(--fill2)}
.rbar .l b{font-size:14px;display:block}
.rbar .l small{font-size:11.5px;color:var(--text2)}
.rbar .r{font-weight:800;letter-spacing:-.02em}
.c-orange{color:var(--r-orange)} .c-green{color:var(--r-green)} .c-blue{color:var(--r-blue)}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 18px;border-radius:16px;font-weight:650;font-size:16px;background:var(--accent);color:#fff;width:100%}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn-row{display:flex;gap:10px;margin-top:14px}

/* ---------- 底部導覽（浮動玻璃） ---------- */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 12px);z-index:20;pointer-events:none}
.dock .in{max-width:540px;margin:0 auto;padding:0 16px;display:flex;gap:10px;align-items:center}
.tabs{position:relative;flex:1;height:64px;border-radius:999px;pointer-events:auto}
/* 模糊背景與會動的內容分開：滑塊移動時不會讓毛玻璃重新計算 */
.tabs-bg{position:absolute!important;inset:0;border-radius:999px;pointer-events:none}
.tabs-in{position:relative;height:100%;padding:5px;display:grid;grid-template-columns:repeat(5,1fr);touch-action:none;user-select:none;-webkit-user-select:none}
.tabs button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;white-space:nowrap;font-weight:600;color:var(--text2);padding:6px 0 5px;border-radius:999px;transition:color .2s}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent)}
.tabs .lens{border-radius:999px}.tabs .lens>i{background:var(--lens-rest)}
.fab{width:64px;height:64px;border-radius:50%;pointer-events:auto;display:grid;place-items:center;color:var(--accent);flex:none;
  transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.fab svg{width:27px;height:27px}
.fab:active{transform:scale(.88);transition-duration:.12s}
.tabs-in>button:active svg{transform:scale(.9)}

/* ---------- 底部表單 ---------- */
.mask{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.mask .dim{position:absolute;inset:0;background:rgba(0,0,0,.3);will-change:opacity;transition:opacity .28s;animation:dimIn .25s}
@keyframes dimIn{from{opacity:0}}
.mask.closing .dim{opacity:0}
/* 表單不用即時模糊（後面已經有暗色遮罩），拖動和收起時只需要移動，不用重算模糊 */
.sheet{position:relative;width:100%;max-width:540px;border-radius:30px 30px 0 0;max-height:86vh;overflow-y:auto;padding:0 18px calc(var(--safe-b) + 20px);
  animation:up .3s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain;border-bottom:0;will-change:transform;
  background:var(--sheet-bg)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
@keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
.sh-head{position:sticky;top:0;z-index:5;margin:0 -18px 14px;padding:8px 18px 10px;cursor:grab;touch-action:none;
  background:linear-gradient(var(--sheet-bg) 78%,transparent)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--text3);opacity:.5;margin:0 auto 10px}
.sh-bar{display:flex;align-items:center;gap:10px}
.sheet h2{margin:0;flex:1;min-width:0;font-size:21px;font-weight:750;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--text2);flex:none}
.xbtn svg{width:16px;height:16px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.types button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text2)}
.types .ti{width:56px;height:56px;border-radius:17px}
.types .ti svg{width:26px;height:26px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;color:var(--text2);font-weight:600;margin:0 4px 6px}
.field input,.field select,.field textarea{width:100%;height:46px;padding:0 14px;border:0;border-radius:13px;background:var(--fill);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 2px var(--accent)}
.field textarea{height:auto;min-height:76px;padding:12px 14px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>*{min-width:0}
.dt{position:relative;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:13px;background:var(--fill);font-size:16px;cursor:pointer}
.dt:focus-within{box-shadow:0 0 0 2px var(--accent)}
.dt .dtv{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt .dtv.ph{color:var(--text3)}
.dt svg{width:18px;height:18px;color:var(--text3);flex:none}
.dt input{position:absolute!important;inset:0;width:100%!important;height:100%!important;opacity:0;margin:0;padding:0!important;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.field input[type=date],.field input[type=time]{min-width:0;max-width:100%;display:block;text-align:left}
.field input::-webkit-date-and-time-value{text-align:left;margin:0;line-height:22px;min-height:22px}
.field input::-webkit-datetime-edit{padding:0;line-height:22px}
.field input::-webkit-datetime-edit-fields-wrapper{padding:0}
.tabs-in>button svg{transition:transform .2s}
.dragging>button.on svg{transform:scale(1.15)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts button{height:34px;padding:0 13px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;line-height:1}
.opts button svg{width:15px;height:15px}
.opts button.on{background:var(--accent);color:#fff}
.photo-pick{display:flex;align-items:center;gap:14px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin:0 6px 10px}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translate(-50%,10px);background:var(--glass-strong);color:var(--text);padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:600;z-index:60;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 日記 ---------- */
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.pill-btn{height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:650;flex:none}
.pill-btn svg{width:16px;height:16px;color:var(--accent)}
.dentry{padding:14px 14px 16px;margin-bottom:12px;cursor:pointer}
.dentry .dh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);font-weight:600}
.dentry .dh .mood{font-size:17px}
.dentry .dh .cs{margin-left:auto;display:flex;padding-left:6px}
.dentry .dh .cs .av{width:24px;height:24px;font-size:13px;margin-left:-6px;box-shadow:0 0 0 2px var(--glass-strong)}
.dentry .txt{font-size:15px;line-height:1.7;margin-top:10px;white-space:pre-wrap;word-break:break-word}
.pg{display:grid;gap:3px;border-radius:16px;overflow:hidden;margin-top:12px}
.pg .c{position:relative;aspect-ratio:1;overflow:hidden;background:var(--fill)}
.pg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pg.n1{grid-template-columns:1fr}.pg.n1 .c{aspect-ratio:4/3}
.pg.n2{grid-template-columns:1fr 1fr}
.pg.nm{grid-template-columns:repeat(3,1fr)}
.pg .more{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
.mem{overflow:hidden;padding:0;margin-bottom:14px;cursor:pointer}
.mem .im{position:relative;aspect-ratio:16/10;background:var(--fill)}
.mem img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mem .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff}
.mem .cap b{display:block;font-size:17px;letter-spacing:-.01em}.mem .cap span{font-size:13px;opacity:.92;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem.noimg .cap{position:static;background:none;color:var(--text);padding:16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-h b{font-size:17px;letter-spacing:-.01em}
.cal-h button{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.cal-h button:disabled{opacity:.3}
.cal-h button svg{width:16px;height:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11.5px;color:var(--text3);font-weight:600;padding:0 0 4px}
.cal .d{position:relative;aspect-ratio:1;border-radius:10px;background:var(--fill2);overflow:hidden;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--text2)}
.cal .d img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cal .d.img .n{position:absolute;left:4px;top:2px;font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:1}
.cal .d.dot::after{content:"";position:absolute;bottom:5px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.cal .d.today.img{box-shadow:0 0 0 2px var(--accent)}
.cal .d.future{opacity:.35}
.cal .blank{background:none}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:18px;overflow:hidden}
.album button{aspect-ratio:1;position:relative;overflow:hidden;background:var(--fill)}
.album img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-edit{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.ph-edit::-webkit-scrollbar{display:none}
.ph-edit .p{position:relative;width:80px;height:80px;border-radius:14px;overflow:hidden;flex:none;background:var(--fill)}
.ph-edit .p img{width:100%;height:100%;object-fit:cover}
.ph-edit .p.busy{display:grid;place-items:center;font-size:11.5px;color:var(--text2)}
.ph-edit .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.ph-edit .rm svg{width:12px;height:12px}
.ph-edit .add{width:80px;height:80px;border-radius:14px;border:1.5px dashed var(--text3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--text2);flex:none}
.ph-edit .add svg{width:22px;height:22px}
.viewer{position:fixed;inset:0;z-index:70;background:#000;display:none}
.viewer.show{display:block}
.vtrack{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.vtrack::-webkit-scrollbar{display:none}
.vtrack .s{flex:none;width:100vw;height:100%;scroll-snap-align:center;display:grid;place-items:center}
.vtrack img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vclose{position:absolute;top:calc(var(--safe-t) + 12px);right:16px;background:rgba(255,255,255,.18);color:#fff}
.viewer .vcount{position:absolute;top:calc(var(--safe-t) + 19px);left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:600;pointer-events:none}

/* ---------- 餵食流程 ---------- */
.steps{height:3px;background:var(--fill);border-radius:2px;margin:-2px 0 16px;overflow:hidden}
.steps i{display:block;height:100%;background:var(--text);border-radius:2px;transition:width .35s}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:13px;background:var(--fill);margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--text3);flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0;height:100%}
.fav{width:36px;height:36px;display:grid;place-items:center;color:var(--text3);flex:none;margin-right:-6px}
.fav svg{width:20px;height:20px}
.fav.on{color:#ff2d55}
.initial{width:38px;height:38px;border-radius:11px;background:var(--fill);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;color:var(--text2)}
.foodcard{padding:12px 14px;border-radius:18px;background:var(--fill2);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.foodcard b{display:block;font-size:15.5px}.foodcard span.sub{display:block;font-size:13px;color:var(--text2);margin-top:1px}
.reacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reacts button{height:52px;border-radius:14px;background:var(--fill2);border:1.5px solid transparent;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;font-weight:650;font-size:15px;text-align:left}
.reacts button.on{border-color:var(--text);background:var(--glass-card)}
.reacts .ck{margin-left:auto;width:20px;height:20px;border-radius:50%;background:var(--text);color:var(--bg);display:none;place-items:center}
.reacts .ck svg{width:12px;height:12px}
.reacts button.on .ck{display:grid}
.shape{width:18px;height:18px;flex:none;display:inline-block}
.rshape{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:5px}
.special{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--fill2);margin-bottom:14px;cursor:pointer}
.special .bi{width:34px;height:34px;border-radius:10px;background:var(--warn-bg);color:var(--warn);display:grid;place-items:center;flex:none}
.special .bi svg{width:18px;height:18px}
.special b{font-size:15px;display:block}.special small{font-size:12.5px;color:var(--text2);line-height:1.5;display:block;margin-top:2px}
.special input{margin:6px 0 0 auto;width:22px;height:22px;flex:none;accent-color:var(--accent)}
.success{position:fixed;inset:0;z-index:80;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s}
.success.show{opacity:1}
.success .box{padding:22px 28px 20px;border-radius:24px;text-align:center;min-width:230px;transform:scale(.88);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.success.show .box{transform:none}
.success .box svg{width:38px;height:38px;color:#e0782f;margin:0 auto 8px;display:block}
.success b{display:block;font-size:17px}.success span{display:block;font-size:13px;color:var(--text2);margin-top:4px}
.stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin:2px 0 10px}
.stack i{display:block;height:100%}
.rrow{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 0}
.rrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .ct{font-weight:600}
.rrow .pc{color:var(--text3);width:40px;text-align:right;font-size:12.5px}
.sub-h{font-size:13px;font-weight:650;color:var(--text2);margin:18px 0 8px}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px;color:var(--text2)}

</style>
</head>

  </div>
  <div class="cats" id="catSwitch"></div>
  <section id="view-home"></section>

  <section id="view-settings" class="hide"></section>
</div>

<div class="dock"><div class="in">

      <button data-view="diary"></button>
      <button data-view="records"></button>
      <button data-view="charts"></button>
      <button data-view="recap"></button>

</div></div>

<div class="mask" id="mask"><div class="dim" id="dim"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="viewer" id="viewer"><div class="vtrack"></div><div class="vcount"></div><button class="xbtn vclose" aria-label="關閉"></button></div>

const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function nowTime(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function toUTC(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function fromUTC(t){const d=new Date(t);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
function addDays(s,n){return fromUTC(toUTC(s)+n*864e5)}
function diffDays(a,b){return Math.round((toUTC(b)-toUTC(a))/864e5)}
function fmtDate(s){return s?s.replace(/-/g,'.'):''}
function fmtShort(s){const [,m,d]=s.split('-');return `${+m}/${+d}`}
function fmtLong(s){const [y,m,d]=s.split('-');return `${y}年${+m}月${+d}日`}
function weekday(s){return '週'+'日一二三四五六'[new Date(toUTC(s)).getUTCDay()]}
function relDays(n){
  if(n===0)return '今天'; if(n===1)return '昨天'; if(n===2)return '前天';
  if(n<0)return `${-n} 天後`; if(n<30)return `${n} 天前`; if(n<365)return `${Math.floor(n/30)} 個月前`;
  return `${Math.floor(n/365)} 年前`;
}
function ageParts(birth){
  const t=todayStr(); if(!birth||birth>t)return null;
  let [by,bm,bd]=birth.split('-').map(Number),[ty,tm,td]=t.split('-').map(Number);
  let y=ty-by,m=tm-bm,d=td-bd;
  if(d<0){m--;d+=new Date(ty,tm-1,0).getDate()} if(m<0){y--;m+=12}
  return {y,m,d,total:diffDays(birth,t)};
}
function ageText(birth){const a=ageParts(birth);if(!a)return '';if(a.y===0&&a.m===0)return `${a.d} 天大`;if(a.y===0)return `${a.m} 個月 ${a.d} 天`;return `${a.y} 歲 ${a.m} 個月`}
function humanAge(birth){
  const a=ageParts(birth); if(!a)return null; const yrs=a.total/365.25; let h;
  if(yrs<=1){const tbl=[[0,0],[1,1],[2,2],[3,4],[4,6],[6,10],[8,13],[12,15]],mo=yrs*12;
    for(let i=1;i<tbl.length;i++){if(mo<=tbl[i][0]){const [m0,h0]=tbl[i-1],[m1,h1]=tbl[i];h=h0+(h1-h0)*(mo-m0)/(m1-m0);break}}}
  else if(yrs<=2)h=15+(yrs-1)*9; else h=24+(yrs-2)*4;
  return Math.round(h);
}
function nextBirthday(b){const t=todayStr(),y=+t.slice(0,4);let [,m,d]=b.split('-');if(m==='02'&&d==='29')d='28';let nb=`${y}-${m}-${d}`;if(nb<t)nb=`${y+1}-${m}-${d}`;return diffDays(t,nb)}

let CID=0; const BINDS=[];
function flushCharts(){while(BINDS.length){const [id,fn]=BINDS.shift();const el=document.getElementById(id);if(el)fn(el)}}
function niceTicks(mn,mx,count=4){
  const span=mx-mn||1, raw=span/count, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(s=>s*mag).find(s=>span/s<=count)||raw;
  const lo=Math.floor(mn/step)*step, hi=Math.ceil(mx/step)*step, out=[];
  for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(6));
  return out;
}
function monotonePath(P){
  const n=P.length; if(n===1)return `M${P[0][0]},${P[0][1]}`;
  const dx=[],m=[],t=[];
  for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];m[i]=(P[i+1][1]-P[i][1])/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];
  for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=t[i+1]=0;continue}const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}
  let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${(P[i][0]+h).toFixed(1)},${(P[i][1]+t[i]*h).toFixed(1)} ${(P[i+1][0]-h).toFixed(1)},${(P[i+1][1]-t[i+1]*h).toFixed(1)} ${P[i+1][0].toFixed(1)},${P[i+1][1].toFixed(1)}`}
  return d;
}
function tipPos(el,tip,svgEl,vx,vy,W,H){
  const r=svgEl.getBoundingClientRect(),er=el.getBoundingClientRect();
  let px=vx/W*r.width+(r.left-er.left), py=vy/H*r.height+(r.top-er.top);
  const half=tip.offsetWidth/2; px=Math.max(half,Math.min(er.width-half,px));
  tip.style.left=px+'px'; tip.style.top=py+'px'; tip.classList.add('show');
}
// 折線圖：pts=[{x:'YYYY-MM-DD',y:number}]
function lineChart(o){
  const id='ch'+(++CID), pts=o.pts, W=340, H=o.h||200, L=34, R=16, T=22, B=24;
  if(!pts.length)return `<div class="empty">${o.empty||'還沒有資料'}</div>`;
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys),mx=Math.max(...ys);
  const padv=Math.max((mx-mn)*.25,o.minPad||.2); const ticks=niceTicks(Math.max(0,mn-padv),mx+padv,3);
  mn=ticks[0]; mx=ticks[ticks.length-1];
  const d0=toUTC(o.from||pts[0].x), d1=toUTC(o.to||pts[pts.length-1].x), span=Math.max(d1-d0,1);
  const X=p=>pts.length===1&&!o.from?(L+W-R)/2:L+(toUTC(p.x)-d0)/span*(W-L-R);
  const Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const P=pts.map(p=>[X(p),Y(p.y)]);
  const line=monotonePath(P);
  const area=P.length>1?`${line}L${P[P.length-1][0].toFixed(1)},${H-B}L${P[0][0].toFixed(1)},${H-B}Z`:'';
  const grid=ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax num" x="${L-7}" y="${Y(v)+3.5}" text-anchor="end">${o.fmtAxis?o.fmtAxis(v):v}</text>`).join('');
  // x 軸：最多 5 個日期
  const nx=Math.min(5,pts.length), xl=[];
  if(o.from){for(let i=0;i<5;i++){const t=d0+span*i/4;xl.push(`<text class="ax" x="${L+(t-d0)/span*(W-L-R)}" y="${H-6}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${fmtShort(fromUTC(t))}</text>`)}}
  else for(let i=0;i<nx;i++){const k=nx===1?0:Math.round(i*(pts.length-1)/(nx-1));xl.push(`<text class="ax" x="${P[k][0]}" y="${H-6}" text-anchor="middle">${fmtShort(pts[k].x)}</text>`)}
  const last=P[P.length-1], lp=pts[pts.length-1];
  const dots=P.length<=24?P.map((p,i)=>i===P.length-1?'':`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--s1)" />`).join(''):'';
  const gid='g'+id;
  BINDS.push([id,el=>{
    const s=el.querySelector('svg'),tip=el.querySelector('.tip'),guide=el.querySelector('.guide'),hd=el.querySelector('.hdot');
    const move=e=>{const r=s.getBoundingClientRect();const vx=(e.clientX-r.left)/r.width*W;
      let k=0,best=1e9;P.forEach((p,i)=>{const dd=Math.abs(p[0]-vx);if(dd<best){best=dd;k=i}});
      guide.setAttribute('x1',P[k][0]);guide.setAttribute('x2',P[k][0]);guide.style.opacity=1;
      hd.setAttribute('cx',P[k][0]);hd.setAttribute('cy',P[k][1]);hd.style.opacity=1;
      tip.innerHTML=`${fmtLong(pts[k].x)}<b class="num">${o.fmt(pts[k].y)}</b>`;tipPos(el,tip,s,P[k][0],P[k][1],W,H)};
    const out=()=>{tip.classList.remove('show');guide.style.opacity=0;hd.style.opacity=0};
    s.addEventListener('pointermove',move);s.addEventListener('pointerdown',move);s.addEventListener('pointerleave',out);
  }]);
  return `<div class="chart" id="${id}" role="img" aria-label="${esc(o.aria||'折線圖')}">
   <svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--s1)" stop-opacity=".28"/><stop offset="1" stop-color="var(--s1)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${area?`<path d="${area}" fill="url(#${gid})"/>`:''}
    <path d="${line}" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--s1)" stroke="var(--glass-strong)" stroke-width="2"/>
    <text class="dlabel num" x="${Math.min(last[0],W-R)}" y="${last[1]-10}" text-anchor="${last[0]>W-60?'end':'middle'}">${o.fmt(lp.y)}</text>
    ${xl.join('')}
    <line class="guide" x1="0" x2="0" y1="${T-6}" y2="${H-B}" stroke="var(--text3)" stroke-width="1" stroke-dasharray="3 3" style="opacity:0"/>
    <circle class="hdot" r="5" fill="var(--s1)" stroke="var(--glass-strong)" stroke-width="2.5" style="opacity:0"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
   </svg><div class="tip"></div></div>`;
}
// 直條圖：items=[{label,value,tip}]
function barChart(o){
  const id='ch'+(++CID), it=o.items, W=340, H=o.h||170, L=30, R=6, T=22, B=24;
  const maxV=Math.max(...it.map(d=>d.value),0);
  if(!maxV)return `<div class="empty">${o.empty||'這段期間沒有資料'}</div>`;
  const ticks=niceTicks(0,maxV,3), top=ticks[ticks.length-1];
  const band=(W-L-R)/it.length, bw=Math.min(28,band-Math.max(2,band*.32));
  const Y=v=>T+(1-v/top)*(H-T-B), base=H-B;
  const grid=ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax num" x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">${o.fmtAxis?o.fmtAxis(v):v}</text>`).join('');
  const maxI=it.findIndex(d=>d.value===maxV);
  const step=Math.ceil(it.length/7);
  let bars='',labels='',hits='';
  it.forEach((d,i)=>{
    const x=L+band*i+(band-bw)/2, y=Y(d.value), h=base-y, r=Math.min(4,h,bw/2);
    if(d.value>0)bars+=`<path class="bar" data-i="${i}" d="M${x},${base}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${base}Z" fill="var(--s1)"/>`;
    else bars+=`<rect x="${x}" y="${base-1.5}" width="${bw}" height="1.5" rx=".75" fill="var(--grid)"/>`;
    if(i%step===0||i===it.length-1)labels+=`<text class="ax" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${d.label}</text>`;
    hits+=`<rect data-i="${i}" x="${L+band*i}" y="${T-10}" width="${band}" height="${base-T+10}" fill="transparent"/>`;
  });
  const mx=L+band*maxI+band/2;
  BINDS.push([id,el=>{
    const s=el.querySelector('svg'),tip=el.querySelector('.tip'),bs=[...el.querySelectorAll('.bar')];
    const show=e=>{const t=e.target.closest('[data-i]');if(!t)return;const i=+t.dataset.i;
      bs.forEach(b=>b.style.opacity=+b.dataset.i===i?1:.35);
      tip.innerHTML=`${esc(it[i].tip||it[i].label)}<b class="num">${o.fmt(it[i].value)}</b>`;tipPos(el,tip,s,L+band*i+band/2,Y(it[i].value),W,H)};
    const out=()=>{tip.classList.remove('show');bs.forEach(b=>b.style.opacity=1)};
    s.addEventListener('pointermove',show);s.addEventListener('pointerdown',show);s.addEventListener('pointerleave',out);
  }]);
  return `<div class="chart" id="${id}" role="img" aria-label="${esc(o.aria||'直條圖')}"><svg viewBox="0 0 ${W} ${H}">${grid}${bars}
    <text class="dlabel num" x="${mx}" y="${Y(maxV)-7}" text-anchor="middle">${o.fmtShort?o.fmtShort(maxV):o.fmt(maxV)}</text>${labels}${hits}</svg><div class="tip"></div></div>`;
}
// 圓環圖：items=[{key,label,value,color}]

/* 液態玻璃滑塊：點選或用手指拖曳，放開後彈性吸附 */
const SLIDERS=new Set();
function liquid(el,{index=0,onPick,delay=0}){
  const lens=el.querySelector('.lens'), btns=[...el.querySelectorAll(':scope>button')], n=btns.length;
  let cur=index, shown=-2, x=0, sx=0, lx=0, down=false, drag=false, pid=null, W=0, O=0, L0=0;
  const measure=()=>{W=btns[0].offsetWidth;O=btns[0].offsetLeft};
  const clampX=v=>Math.max(0,Math.min((n-1)*W,v));
  const near=v=>Math.max(0,Math.min(n-1,Math.round(v/W)));
  const mark=i=>{if(i===shown)return;shown=i;btns.forEach((b,k)=>b.classList.toggle('on',k===i))};
  function set(i,anim=true){
    measure(); cur=i;
    lens.style.width=W+'px'; lens.style.left=O+'px'; lens.style.top=btns[0].offsetTop+'px'; lens.style.height=btns[0].offsetHeight+'px';
    if(i<0){lens.style.opacity=0;mark(-1);return}
    lens.style.opacity=1; lens.style.transition=anim?'':'none'; x=i*W; lens.style.transform=`translate3d(${x}px,0,0)`; mark(i);
  }
  el.addEventListener('pointerdown',e=>{
    if(e.button>0)return; measure(); down=true; drag=false; pid=e.pointerId; sx=e.clientX;
    L0=el.getBoundingClientRect().left+O;
    lx=cur>=0?cur*W:clampX(sx-L0-W/2);
    try{el.setPointerCapture(pid)}catch(_){}
  });
  el.addEventListener('pointermove',e=>{
    if(!down||e.pointerId!==pid)return;
    const dx=e.clientX-sx;
    if(!drag){if(Math.abs(dx)<4)return;drag=true;lens.style.transition='none';lens.style.opacity=1;lens.classList.add('drag');el.classList.add('dragging')}
    x=clampX(lx+dx); lens.style.transform=`translate3d(${x}px,0,0)`; mark(near(x));
  });
  const end=(e,cancel)=>{
    if(!down||e.pointerId!==pid)return; down=false;
    const prev=cur; let i;
    if(cancel)i=prev; else if(drag)i=near(x); else i=Math.max(0,Math.min(n-1,Math.floor((e.clientX-L0)/W)));
    lens.classList.remove('drag'); el.classList.remove('dragging'); set(i,true);
    if(i!==prev&&i>=0&&!cancel){if(delay)setTimeout(()=>onPick(i),delay);else onPick(i)}
  };
  el.addEventListener('pointerup',e=>end(e,false));
  el.addEventListener('pointercancel',e=>end(e,true));
  btns.forEach((b,k)=>b.addEventListener('click',e=>{if(e.detail===0&&k!==cur){set(k);onPick(k)}})); // 鍵盤
  const api={set,get cur(){return cur},el};
  SLIDERS.add(api); requestAnimationFrame(()=>set(cur,false));
  return api;
}
window.addEventListener('resize',()=>SLIDERS.forEach(s=>{if(!s.el.isConnected)SLIDERS.delete(s);else s.set(s.cur,false)}));

function countUp(root){
  const els=[...root.querySelectorAll('[data-count]')],dur=1600,t0=performance.now(),ease=p=>1-Math.pow(1-p,3);

    if(p<1)requestAnimationFrame(step)})(t0);
}

/* 日期／時間：原生選擇器透明蓋在上面，顯示的文字自己畫，iPhone 上一定置中 */
function fmtDTV(inp){
  const v=inp.value; if(!v)return '';
  if(inp.type==='date'){const [y,m,d]=v.split('-');return y===todayStr().slice(0,4)?`${+m}月${+d}日 ${weekday(v)}`:`${y}/${+m}/${+d}`}
  const [h,mi]=v.split(':').map(Number); return `${h<12?'上午':'下午'} ${h%12||12}:${pad(mi)}`;
}
function enhanceDates(root){
  root.querySelectorAll('input[type=date],input[type=time]').forEach(inp=>{
    if(inp.parentNode.classList.contains('dt'))return;
    const w=document.createElement('div'); w.className='dt';
    w.innerHTML=`<span class="dtv"></span>${svg(inp.type==='date'?'cal':'clock',1.8)}`;
    inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
    const v=w.querySelector('.dtv'), upd=()=>{const t=fmtDTV(inp);v.textContent=t||(inp.type==='date'?'選擇日期':'選擇時間');v.classList.toggle('ph',!t)};
    upd(); inp.addEventListener('input',upd); inp.addEventListener('change',upd);
    inp.addEventListener('click',()=>{try{inp.showPicker&&inp.showPicker()}catch(e){}});
  });
}
let SHEET_CLOSE=null;
function openSheet(title,body,opts={}){
  const sh=$('#sheet'),m=$('#mask'); clearTimeout(closeSheet._t);
  if(!m.classList.contains('show')||opts.fresh){SHEET_CLOSE=null}

  sh.innerHTML=`<div class="sh-head"><div class="grab"></div><div class="sh-bar">${opts.back?`<button class="xbtn" id="shBack" aria-label="上一步">${svg('chevL',2.4)}</button>`:''}<h2>${title}</h2><button class="xbtn" id="shClose" aria-label="關閉">${svg('x',2.4)}</button></div></div>${body}`;
  enhanceDates(sh);

let RET=null;

function closeSheet(){
  RET=null;
  const sh=$('#sheet'),m=$('#mask'); if(!m.classList.contains('show'))return;
  if(SHEET_CLOSE){const f=SHEET_CLOSE;SHEET_CLOSE=null;try{f()}catch(e){}}
  document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
  sh.style.transition='transform .26s cubic-bezier(.3,0,.8,.6)'; sh.style.transform='translate3d(0,105%,0)'; $('#dim').style.transition=''; $('#dim').style.opacity=''; m.classList.add('closing');

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#viewer').classList.contains('show'))closeViewer();else closeSheet()}});
// 下拉關閉：在標題列往下拉，或內容已捲到最上面時往下拉
(function(){
  const sh=$('#sheet'),m=$('#mask'),dim=$('#dim'); let sy=null,dy=0,t0=0,drag=false,fromHead=false,atTop=true;
  const startY=y=>{sy=y;dy=0;t0=performance.now();drag=false};
  const moveY=(y,ev)=>{
    if(sy==null)return; const d=y-sy;
    if(!drag){
      if(Math.abs(d)<6)return;
      if(d>0&&(fromHead||(atTop&&sh.scrollTop<=0))){drag=true;dim.style.transition='none'} else{sy=null;return}
    }
    if(ev.cancelable)ev.preventDefault();
    dy=Math.max(0,d); const r=dy<0?0:dy;
    sh.style.transition='none'; sh.style.transform=`translate3d(0,${r}px,0)`;
    dim.style.opacity=Math.max(0,1-r/(sh.offsetHeight||1)).toFixed(3);
  };
  const endY=()=>{
    if(sy==null)return; sy=null; dim.style.transition='';dim.style.opacity='';
    if(!drag)return; drag=false;
    const v=dy/Math.max(1,performance.now()-t0);
    if(dy>Math.min(140,sh.offsetHeight*.3)||v>.65)closeSheet();
    else{sh.style.transition='transform .45s cubic-bezier(.28,1.35,.45,1)';sh.style.transform='translateY(0)'}
  };
  sh.addEventListener('touchstart',e=>{if(e.touches.length>1){sy=null;return}fromHead=!!e.target.closest('.sh-head');atTop=sh.scrollTop<=0;startY(e.touches[0].clientY)},{passive:true});
  sh.addEventListener('touchmove',e=>moveY(e.touches[0].clientY,e),{passive:false});
  sh.addEventListener('touchend',endY); sh.addEventListener('touchcancel',endY);
  // 滑鼠：拖曳標題列
  sh.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||!e.target.closest('.sh-head')||e.target.closest('button'))return;fromHead=true;atTop=true;startY(e.clientY);
    const mv=ev=>moveY(ev.clientY,ev),up=()=>{endY();removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up)});
})();

    ${rs.length?html:`<div class="empty" style="padding:28px 0">還沒有${T.name}的紀錄</div>`}`,{fresh:true});

function resizeImage(file,size){
  return new Promise((ok,no)=>{const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=size;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.82))};
    img.onerror=no;img.src=url});
}

/* ================= 照片儲存（IndexedDB，空間比 localStorage 大很多） ================= */
const PH=(()=>{
  let dbp=null; const cache=new Map();
  const open=()=>dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open('caaat-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
  const run=(mode,fn)=>open().then(db=>new Promise((ok,no)=>{const t=db.transaction('p',mode),q=fn(t.objectStore('p'));t.oncomplete=()=>ok(q?q.result:undefined);t.onerror=t.onabort=()=>no(t.error)}));
  const drop=id=>['f','t'].forEach(k=>{const u=cache.get(id+k);if(u){URL.revokeObjectURL(u);cache.delete(id+k)}});
  return {
    put:(id,v)=>run('readwrite',s=>s.put(v,id)),
    get:id=>run('readonly',s=>s.get(id)),
    del:id=>{drop(id);return run('readwrite',s=>s.delete(id))},
    keys:()=>run('readonly',s=>s.getAllKeys()),
    clear:()=>{cache.forEach(u=>URL.revokeObjectURL(u));cache.clear();return run('readwrite',s=>s.clear())},
    async url(id,k='t'){const ck=id+k;if(cache.has(ck))return cache.get(ck);const v=await PH.get(id);if(!v||!v[k])return '';const u=URL.createObjectURL(v[k]);cache.set(ck,u);return u},
    cached:(id,k='t')=>cache.get(id+k)||'',
  };
})();
function phImg(id,k='t',extra=''){const u=PH.cached(id,k);return `<img data-ph="${id}" data-k="${k}"${u?` src="${u}"`:''} alt="" ${extra}>`}
function hydratePhotos(root){if(!root)return;root.querySelectorAll('img[data-ph]').forEach(img=>{if(img.getAttribute('src'))return;PH.url(img.dataset.ph,img.dataset.k||'t').then(u=>{if(u)img.src=u}).catch(()=>{})})}
function loadImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>ok([i,u]);i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};i.src=u})}
function canvasBlob(c,q){return new Promise(r=>c.toBlob(r,'image/jpeg',q))}
async function processPhoto(file){
  const [img,u]=await loadImg(file); const W=img.naturalWidth,H=img.naturalHeight;
  const sc=Math.min(1,1600/Math.max(W,H)), c=document.createElement('canvas');
  c.width=Math.round(W*sc); c.height=Math.round(H*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const s=Math.min(W,H), t=document.createElement('canvas'); t.width=t.height=420;
  t.getContext('2d').drawImage(img,(W-s)/2,(H-s)/2,s,s,0,0,420,420);
  URL.revokeObjectURL(u);
  return {f:await canvasBlob(c,.82),t:await canvasBlob(t,.78)};
}
function blobToDataURL(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
async function exportBackup(){
  try{
    toast('準備備份中…');
    const photos={}; for(const k of await PH.keys()){const v=await PH.get(k);if(v)photos[k]={f:await blobToDataURL(v.f),t:await blobToDataURL(v.t)}}
    const blob=new Blob([JSON.stringify(Object.assign({},DB,{photos}))],{type:'application/json'});
    const file=new File([blob],`caaat-backup-${todayStr()}.json`,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'貓咪日記備份'});return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){if(e&&e.name!=='AbortError')toast('匯出失敗')}
}

function openViewer(ids,start=0){
  const v=$('#viewer'),tr=v.querySelector('.vtrack'),cnt=v.querySelector('.vcount');
  tr.innerHTML=ids.map(id=>`<div class="s">${phImg(id,'f')}</div>`).join('');
  const upd=()=>{cnt.textContent=ids.length>1?`${Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth))+1} / ${ids.length}`:''};
  v.classList.add('show'); hydratePhotos(tr); tr.onscroll=upd;
  requestAnimationFrame(()=>{tr.scrollLeft=start*tr.clientWidth;upd()});
}
function closeViewer(){const v=$('#viewer');v.classList.remove('show');const tr=v.querySelector('.vtrack');tr.style.transform='';v.style.background='';tr.innerHTML=''}
(function(){
  const v=$('#viewer'),tr=v.querySelector('.vtrack'); let sx=0,sy=0,dy=0,mode=null;
  v.querySelector('.vclose').innerHTML=svg('x',2.4); v.querySelector('.vclose').onclick=closeViewer;
  tr.addEventListener('click',e=>{if(e.target.classList.contains('s'))closeViewer()});
  v.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;mode=null;dy=0},{passive:true});
  v.addEventListener('touchmove',e=>{const dx=e.touches[0].clientX-sx,d=e.touches[0].clientY-sy;
    if(!mode){if(Math.abs(d)>8&&Math.abs(d)>Math.abs(dx))mode='v';else if(Math.abs(dx)>8)mode='h'}
    if(mode==='v'){if(e.cancelable)e.preventDefault();dy=d;tr.style.transform=`translate3d(0,${dy}px,0)`;v.style.background=`rgba(0,0,0,${Math.max(.25,1-Math.abs(dy)/400).toFixed(2)})`}},{passive:false});
  v.addEventListener('touchend',()=>{if(mode==='v'){if(Math.abs(dy)>110)closeViewer();else{tr.style.transition='transform .3s';tr.style.transform='';v.style.background='';setTimeout(()=>tr.style.transition='',300)}}mode=null});
})();

/* ================= 日記 ================= */
const MOODS=[['happy','😺','開心'],['sleepy','😴','愛睏'],['naughty','😼','調皮'],['clingy','🥰','撒嬌'],['grumpy','😾','生氣'],['sick','🤒','不舒服']];
const moodEmoji=k=>(MOODS.find(m=>m[0]===k)||[])[1]||'';
function diarySorted(){return (DB.diary||[]).slice().sort((a,b)=>(b.date+(b.created||'')).localeCompare(a.date+(a.created||'')))}
function shiftMonth(ym,n){let [y,m]=ym.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return `${y}-${pad(m)}`}
let DMODE='timeline', DMON=todayStr().slice(0,7);
function photoGrid(e){
  const ids=e.photos||[],n=ids.length; if(!n)return '';
  const show=ids.slice(0,6), cls=n===1?'n1':n===2||n===4?'n2':'nm';
  return `<div class="pg ${cls}">${(n===4?ids:show).map((id,i)=>`<div class="c" data-vph="${e.id}" data-i="${i}">${phImg(id,n===1?'f':'t')}${i===5&&n>6?`<span class="more">+${n-6}</span>`:''}</div>`).join('')}</div>`;
}
function entryCard(e){
  const cs=DB.cats.length>1?(e.catIds||[]).map(id=>catById(id)).filter(Boolean):[];
  return `<div class="card glass dentry" data-entry="${e.id}">
    <div class="dh"><span>${fmtShort(e.date)} ${weekday(e.date)}</span>${e.mood?`<span class="mood">${moodEmoji(e.mood)}</span>`:''}${cs.length?`<span class="cs">${cs.map(c=>avHTML(c)).join('')}</span>`:''}</div>
    ${photoGrid(e)}${e.text?`<div class="txt">${esc(e.text)}</div>`:''}</div>`;
}
function memoryCard(list){
  const t=todayStr(); let best=null,label='';
  for(const e of list){ if(e.date>=t)continue;
    if(e.date.slice(5)===t.slice(5)){best=e;label=`${+t.slice(0,4)-+e.date.slice(0,4)} 年前的今天`;break}
    if(!best&&e.date.slice(8)===t.slice(8)){const m=(+t.slice(0,4)-+e.date.slice(0,4))*12+(+t.slice(5,7)-+e.date.slice(5,7));if(m>0&&m<12){best=e;label=`${m} 個月前的今天`}}
  }
  if(!best)return '';
  const p=(best.photos||[])[0];
  return `<div class="card glass mem ${p?'':'noimg'}" data-entry="${best.id}">${p?`<div class="im">${phImg(p,'f')}<div class="cap"><b>✨ ${label}</b><span>${esc(best.text||fmtLong(best.date))}</span></div></div>`:`<div class="cap"><b>✨ ${label}</b><span>${esc(best.text||'')}</span></div>`}</div>`;
}

    openSheet(fmtLong(d),`<div class="group glass">${es.map(e=>`<div class="row" data-de="${e.id}" role="button">${(e.photos||[])[0]?`<span class="initial" style="overflow:hidden;position:relative">${phImg(e.photos[0],'t','style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"')}</span>`:`<span class="initial">${moodEmoji(e.mood)||'📝'}</span>`}<span class="main"><div class="title">${esc((e.text||'').split('\n')[0]||'（沒有文字）')}</div><div class="desc">${(e.photos||[]).length} 張照片</div></span></div>`).join('')}</div>

/* ================= 飲食分析 ================= */
function dietCard(cat){
  const t=todayStr(), span=FRANGE==='week'?7:FRANGE==='month'?30:0, from=span?addDays(t,-(span-1)):'0000';
  const rs=recsOf(cat.id).filter(r=>r.type==='feed'&&!r.special&&r.date>=from&&r.date<=t);
  const head=`<div class="ctitle"><h3>飲食分析</h3>${segc('f',FRANGE,[['week','7天'],['month','30天'],['all','全部']])}</div>`;
  if(!rs.length)return `<div class="card glass">${head}<div class="empty">這段期間還沒有餵食紀錄<br><small>用 ＋ → 餵食 記錄食物和反應，這裡就會出現分析</small></div></div>`;
  const days=span||Math.max(1,diffDays(rs[rs.length-1].date,t)+1);
  const withFed=rs.filter(r=>+r.fed>0), eat=withFed.reduce((s,r)=>s+eaten(r),0);
  const withR=rs.filter(r=>REACT[r.reaction]), rc={}; withR.forEach(r=>rc[r.reaction]=(rc[r.reaction]||0)+1);
  const refuse=withR.length?Math.round((rc.refuse||0)/withR.length*100):null;
  // 反應分佈
  const stack=withR.length?`<div class="sub-h">進食反應</div><div class="stack">${RORDER.filter(k=>rc[k]).map(k=>`<i style="width:${(rc[k]/withR.length*100).toFixed(1)}%;background:${REACT[k].c}"></i>`).join('')}</div>
    ${RORDER.filter(k=>rc[k]).map(k=>`<div class="rrow">${shape(k)}<span class="nm">${REACT[k].n}</span><span class="ct num">${rc[k]} 次</span><span class="pc num">${Math.round(rc[k]/withR.length*100)}%</span></div>`).join('')}`:'';
  // 肉類比例
  const mc={}; let mn=0; rs.forEach(r=>{const f=r.foodId&&foodById(r.foodId);if(f&&f.meat){mc[f.meat]=(mc[f.meat]||0)+1;mn++}});
  let meats=Object.entries(mc).sort((a,b)=>b[1]-a[1]); if(meats.length>6){const rest=meats.slice(5).reduce((s,x)=>s+x[1],0);meats=meats.slice(0,5).concat([['其他',rest]])}
  const meatHTML=mn?`<div class="sub-h">口味（肉類）比例</div>${meats.map(([m,c])=>`<div class="hbar"><span class="lab">${esc(m)}</span><span class="track"><span class="fill" style="display:block;width:${(c/meats[0][1]*100).toFixed(1)}%"></span></span><span class="amt num">${Math.round(c/mn*100)}%</span></div>`).join('')}`:'';
  // 最愛 / 拒吃
  const fs={}; rs.forEach(r=>{if(!r.foodId||!foodById(r.foodId))return;const o=fs[r.foodId]=fs[r.foodId]||{n:0,sum:0,rn:0,ref:0};o.n++;if(REACT[r.reaction]){o.sum+=REACT[r.reaction].s;o.rn++;if(r.reaction==='refuse')o.ref++}});
  const keyOf=a=>a>=3.5?'love':a>=2.5?'ok':a>=1.5?'meh':'refuse';
  const ranked=Object.entries(fs).filter(([,o])=>o.rn).map(([id,o])=>({id,...o,avg:o.sum/o.rn})).sort((a,b)=>b.avg-a.avg||b.n-a.n);
  const favs=ranked.filter(x=>x.avg>=2.5).slice(0,5), refs=ranked.filter(x=>x.ref>0).sort((a,b)=>b.ref/b.n-a.ref/a.n).slice(0,5);
  const frow=x=>`<div class="rrow">${shape(keyOf(x.avg))}<span class="nm">${esc(foodTitle(foodById(x.id)))}</span><span class="ct num">${x.n} 次</span></div>`;
  return `<div class="card glass">${head}
    <div class="kpis"><div class="kpi"><span>餵食</span><b class="num">${rs.length}<small style="font-size:12px;color:var(--text2)"> 次</small></b></div>
      <div class="kpi"><span>平均每天吃</span><b class="num">${withFed.length?Math.round(eat/days):'—'}<small style="font-size:12px;color:var(--text2)"> g</small></b></div>
      <div class="kpi"><span>拒食率</span><b class="num">${refuse??'—'}<small style="font-size:12px;color:var(--text2)">${refuse!=null?' %':''}</small></b></div></div>
    ${stack}${meatHTML}
    ${favs.length?`<div class="sub-h">最愛食物</div>${favs.map(frow).join('')}`:''}
    ${refs.length?`<div class="sub-h">常拒吃</div>${refs.map(x=>`<div class="rrow">${shape('refuse')}<span class="nm">${esc(foodTitle(foodById(x.id)))}</span><span class="ct num">拒絕 ${x.ref}/${x.n} 次</span></div>`).join('')}`:''}
  </div>`;
}

/* ================= 自動更新 =================
   主畫面 App 會沿用快取的舊頁面。每次打開或切回 App 時，向伺服器確認有沒有新版本；
   有的話就提示，點一下就更新（資料存在手機裡，更新不會不見）。 */
const APP_VERSION='2026.11.06.7';
let updateShown=false;
async function checkUpdate(){
  if(updateShown||location.protocol==='file:')return;
  try{
    const res=await fetch(location.pathname,{cache:'reload'});
    const m=(await res.text()).match(/const APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION){
      updateShown=true;
      const b=document.createElement('button');
      b.className='toast show'; b.style.pointerEvents='auto'; b.style.bottom='calc(var(--safe-b) + 92px)';
      b.textContent='有新版本，點一下更新';
      b.onclick=()=>{b.textContent='更新中…';location.reload()};
      document.body.appendChild(b);
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
window.addEventListener('pageshow',checkUpdate);

render();
checkUpdate();
</script>
</body>

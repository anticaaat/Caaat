<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>打工時數計算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ── 全域 ── */
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { overflow: hidden; background: #f1f5f9; overscroll-behavior: none; }

        /* ── 鎖定背景捲動 ── */
        .lock-bg { overflow: hidden !important; touch-action: none !important; }
        .scrollable-content { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

        /* ── 日曆格子 ── */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
        .day-cell {
            padding: 5px 4px; border-radius: 10px; border: 1px solid #e9eef5;
            background: #fff; display: flex; flex-direction: column;
            min-height: 82px; position: relative; cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .day-cell:active { transform: scale(.94); box-shadow: none; }
        .day-cell.is-today { outline: 2px solid #3b82f6; outline-offset: -1px; background: #eff6ff !important; z-index: 5; }
        .day-cell.is-weekend { background: #fff8f8; }
        .day-cell.is-holiday { background: #fff1f1 !important; border-color: #fecaca !important; }

        /* 假日紅點 */
        .holiday-dot {
            position: absolute; top: 4px; right: 4px;
            width: 5px; height: 5px; border-radius: 50%; background: #ef4444;
        }

        /* ── 搜尋列 ── */
        #searchWrapper {
            transition: all .35s cubic-bezier(.4,0,.2,1);
            width: 40px; height: 40px; overflow: hidden;
            display: flex; align-items: center; background: #f1f5f9;
            border-radius: 9999px; position: relative; flex-shrink: 0;
            border: 1px solid #e2e8f0;
        }
        #searchWrapper.active { flex-grow: 1; width: 100%; }
        #searchInput {
            opacity: 0; width: 100%; font-size: 14px; font-weight: 700;
            border: none; background: transparent; padding: 0 40px;
            height: 100%; outline: none; display: none;
        }
        #searchWrapper.active #searchInput { opacity: 1; display: block; }

        /* ── 小圖示按鈕 ── */
        .icon-btn {
            width: 40px; height: 40px; display: flex; align-items: center;
            justify-content: center; background: #f1f5f9; border-radius: 9999px;
            border: 1px solid #e2e8f0; flex-shrink: 0; transition: background .15s;
        }
        .icon-btn:active { background: #e2e8f0; }
        .icon-btn svg { width: 20px; height: 20px; color: #64748b; }

        /* ── iOS Toggle ── */
        .ios-switch { position: relative; display: inline-block; width: 44px; height: 26px; }
        .ios-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background: #e2e8f0; transition: .3s; border-radius: 26px; }
        .slider::before {
            content: ""; position: absolute; width: 22px; height: 22px;
            left: 2px; bottom: 2px; background: #fff; border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,.15); transition: .3s;
        }
        input:checked + .slider { background: #34c759; }
        input:checked + .slider::before { transform: translateX(18px); }

        /* ── 捲動滾輪 Picker ── */
        .picker-container {
            position: relative; height: 120px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: #f8fafc; border-radius: 10px;
            mask-image: linear-gradient(to bottom,transparent,#000 35%,#000 65%,transparent);
            -webkit-mask-image: linear-gradient(to bottom,transparent,#000 35%,#000 65%,transparent);
        }
        .picker-wheel {
            position: absolute; top: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            will-change: transform; cursor: ns-resize; touch-action: none;
        }
        .picker-item { height: 32px; line-height: 32px; font-size: .88rem; font-weight: 600; color: #94a3b8; user-select: none; }
        .picker-item.selected { color: #3b82f6; font-size: 1rem; font-weight: 800; }
        .picker-selection-bar {
            position: absolute; top: 50%; left: 0; right: 0; height: 32px;
            transform: translateY(-50%); background: rgba(59,130,246,.07);
            border-top: 1px solid rgba(59,130,246,.12); border-bottom: 1px solid rgba(59,130,246,.12);
            pointer-events: none; z-index: 10;
        }

        /* ── 新增按鈕 ── */
        .add-btn {
            width: 58px; height: 58px; background: #0f172a; color: #fff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 12px 28px -6px rgba(15,23,42,.45);
            border: 4px solid #fff;
            transition: transform .18s cubic-bezier(.175,.885,.32,1.275), box-shadow .18s;
        }
        .add-btn:active { transform: scale(.88) translateY(4px); box-shadow: 0 4px 10px -3px rgba(15,23,42,.3); }

        /* ── 顏色點 ── */
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all .18s; }
        .color-dot.selected { border-color: #0f172a; transform: scale(1.15); }

        /* ── 滑動刪除 ── */
        .swipe-item-container { position: relative; overflow: hidden; border-radius: 1rem; }
        .swipe-content { position: relative; z-index: 2; transition: transform .28s ease; background: #fff; }
        .swipe-actions {
            position: absolute; top: 4px; bottom: 4px; right: 4px; width: 68px;
            background: #ef4444; display: flex; align-items: center; justify-content: center;
            z-index: 1; border-radius: .9rem;
        }
        .swipe-content.swiped { transform: translateX(-78px); }

        /* ── 隱藏捲軸 ── */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ── 年月切換動畫 ── */
        #monthView, #yearView { transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .28s ease; }

        /* ── 底部固定按鈕安全區 ── */
        .add-btn-container {
            position: absolute; bottom: calc(72px + var(--safe-bottom));
            left: 50%; transform: translateX(-50%); z-index: 100;
        }

        /* ── Modal 底部安全區 ── */
        #editModal .modal-inner { padding-bottom: calc(1.75rem + var(--safe-bottom)); }

        /* ── 統計條 ── */
        #statsBar {
            background: linear-gradient(135deg,#f8fafc 0%,#eff6ff 100%);
            border: 1px solid #dbeafe;
        }

        /* ── 淡入動畫 ── */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeSlideUp .22s ease both; }
    </style>
</head>
<body class="text-slate-800 font-sans">

<div id="app" class="max-w-md mx-auto h-screen flex flex-col bg-white shadow-2xl relative">

    <!-- ══════════════ 設定面板 ══════════════ -->
    <div id="settingsOverlay" class="fixed inset-0 bg-slate-900/60 z-[110] backdrop-blur-sm hidden items-center justify-center p-5 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-[2rem] shadow-2xl p-6 flex flex-col items-center max-h-[88vh] overflow-y-auto no-scrollbar scrollable-content border border-slate-100">
            <div class="w-full flex justify-between items-center mb-5">
                <h3 class="text-xl font-black text-slate-900">設定</h3>
                <button onclick="toggleSettings()" class="p-2 bg-slate-50 rounded-full text-slate-400 active:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="w-full space-y-4">
                <div class="flex flex-col">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">預設時薪</label>
                    <input type="number" id="settingDefaultRate" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3 px-4 font-black text-xl text-center outline-none focus:border-blue-400 transition shadow-sm">
                </div>
                <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 space-y-4">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest">內容顯示</label>
                    <!-- 顯示開關列表 -->
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-700 text-sm">顯示標題</span>
                        <label class="ios-switch"><input type="checkbox" id="checkShowTitle" onchange="updateSetting('showTitle',this.checked)"><span class="slider"></span></label>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-700 text-sm">顯示時間</span>
                        <label class="ios-switch"><input type="checkbox" id="checkShowTime" onchange="updateSetting('showTime',this.checked)"><span class="slider"></span></label>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-700 text-sm">顯示時數</span>
                        <label class="ios-switch"><input type="checkbox" id="checkShowHours" onchange="updateSetting('showHours',this.checked)"><span class="slider"></span></label>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-700 text-sm">顯示薪資預估</span>
                        <label class="ios-switch"><input type="checkbox" id="checkShowSalary" onchange="updateSetting('showSalary',this.checked)"><span class="slider"></span></label>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-700 text-sm">顯示備註</span>
                        <label class="ios-switch"><input type="checkbox" id="checkShowNote" onchange="updateSetting('showNote',this.checked)"><span class="slider"></span></label>
                    </div>
                </div>
                <div class="bg-blue-50 rounded-2xl p-4 border border-blue-100 space-y-3">
                    <label class="block text-[10px] font-black text-blue-400 uppercase tracking-widest">資料備份</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="exportData()" class="py-2.5 bg-white border border-blue-200 text-blue-600 text-xs font-black rounded-xl shadow-sm active:scale-95 transition-all">匯出代碼</button>
                        <button onclick="importData()" class="py-2.5 bg-blue-600 text-white text-xs font-black rounded-xl shadow-sm active:scale-95 transition-all">匯入代碼</button>
                    </div>
                </div>
                <button onclick="saveSettings()" class="w-full bg-slate-900 text-white font-black py-3.5 rounded-2xl shadow-xl active:scale-95 transition-all">完成設定</button>
            </div>
        </div>
    </div>

    <!-- ══════════════ 區間查詢面板 ══════════════ -->
    <div id="rangeStatsOverlay" class="fixed inset-0 bg-slate-900/60 z-[150] backdrop-blur-sm hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-[2rem] shadow-2xl p-6 flex flex-col max-h-[92vh] border border-slate-100 scrollable-content">
            <div class="flex justify-between items-center mb-5 shrink-0">
                <h3 class="text-xl font-black text-slate-900">區間薪資查詢</h3>
                <button onclick="toggleRangeStats()" class="p-2 bg-slate-50 rounded-full text-slate-400 active:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="space-y-3 mb-5 shrink-0">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <label class="text-[9px] font-black text-blue-500 uppercase block mb-1">開始日期</label>
                        <input type="date" id="statsStartDate" class="w-full bg-transparent font-bold text-sm outline-none cursor-pointer">
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <label class="text-[9px] font-black text-blue-500 uppercase block mb-1">結束日期</label>
                        <input type="date" id="statsEndDate" class="w-full bg-transparent font-bold text-sm outline-none cursor-pointer">
                    </div>
                </div>
                <div class="bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-100">
                    <label class="text-[9px] font-black text-slate-400 uppercase block mb-1">過濾工作標題（留空統計全部）</label>
                    <input type="text" id="statsFilterTitle" placeholder="例：便利商店" class="w-full bg-transparent font-bold text-sm outline-none">
                </div>
                <div class="flex gap-2">
                    <button onclick="execRangeStats()" class="flex-grow bg-blue-600 text-white font-black py-3 rounded-2xl shadow-lg active:scale-95 transition-all text-sm">執行查詢</button>
                    <button id="copyRangeBtn" onclick="copyRangeToClipboard()" class="hidden w-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center active:scale-95 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    </button>
                </div>
            </div>
            <div id="rangeResultSummary" class="hidden grid grid-cols-2 gap-3 bg-blue-50 p-4 rounded-2xl mb-4 border border-blue-100 shrink-0">
                <div>
                    <p class="text-[9px] font-black text-blue-400 uppercase">區間總薪資</p>
                    <p id="rangeTotalSalary" class="text-xl font-black text-blue-600">$0</p>
                </div>
                <div>
                    <p class="text-[9px] font-black text-blue-400 uppercase">區間總工時</p>
                    <p id="rangeTotalHours" class="text-xl font-black text-slate-800">0.0h</p>
                </div>
            </div>
            <div id="rangeDetailsList" class="flex-grow overflow-y-auto space-y-2 no-scrollbar scrollable-content pb-2"></div>
        </div>
    </div>

    <!-- ══════════════ 頂部 Header ══════════════ -->
    <header class="bg-white px-4 pt-5 pb-2 border-b border-slate-100 shrink-0 z-50">
        <div id="navHeader" class="flex justify-between items-center mb-3">
            <button onclick="changeDate(-1)" class="p-2 text-slate-400 active:bg-slate-50 rounded-full transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex flex-col items-center gap-0.5">
                <h1 id="yearDisplay" onclick="toggleView()" class="text-lg font-black text-slate-900 cursor-pointer hover:text-blue-600 transition-colors leading-tight">2026年</h1>
                <h2 id="monthDisplay" class="text-xs font-black text-blue-500 leading-tight">2月</h2>
            </div>
            <button onclick="changeDate(1)" class="p-2 text-slate-400 active:bg-slate-50 rounded-full transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>

        <!-- 搜尋 + 中間 Today + 右側圖示 -->
        <div id="searchContainer" class="flex items-center gap-2 mb-3 h-10">
            <div id="searchWrapper">
                <button onclick="openSearch()" class="absolute left-0 w-10 h-10 flex items-center justify-center text-slate-500 z-10">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </button>
                <input type="text" id="searchInput" oninput="execSearch()" onblur="handleSearchBlur()" placeholder="搜尋紀錄標題..." class="font-bold outline-none">
                <button onclick="closeSearch()" id="clearSearchBtn" class="absolute right-0 w-10 h-10 flex items-center justify-center text-slate-400 z-10 hidden">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="centerActions" class="flex-grow flex justify-center items-center">
                <button onclick="goToToday()" class="px-6 py-2 bg-slate-900 text-white rounded-full text-[10px] font-black uppercase tracking-widest shadow-md active:scale-95 transition-all">Today</button>
            </div>
            <button onclick="toggleRangeStats()" class="icon-btn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </button>
            <button onclick="toggleSettings()" class="icon-btn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>

        <!-- 統計條 -->
        <div id="statsBar" class="grid grid-cols-2 gap-2 p-3.5 rounded-2xl mt-1 shadow-sm">
            <div class="border-r border-blue-100 pr-2">
                <p id="labelSalary" class="text-[9px] uppercase text-slate-400 font-black mb-0.5">預估本月薪資</p>
                <p id="totalSalaryNet" class="text-2xl font-black text-blue-600 leading-none">$0</p>
            </div>
            <div class="pl-2">
                <p id="labelHours" class="text-[9px] uppercase text-slate-400 font-black mb-0.5">本月累計工時</p>
                <p id="totalHoursNet" class="text-2xl font-black text-slate-800 leading-none">0.0 <span class="text-[10px] font-normal opacity-40">hr</span></p>
            </div>
        </div>
    </header>

    <!-- ══════════════ 主要內容區 ══════════════ -->
    <div class="relative flex-grow overflow-hidden" id="mainViewArea">
        <!-- 搜尋結果浮層 -->
        <div id="searchResultsOverlay" class="absolute inset-x-0 top-0 max-h-full z-[70] bg-white shadow-xl overflow-y-auto hidden p-4 space-y-2 rounded-b-[1.5rem] border-b border-slate-100 scrollable-content no-scrollbar"></div>

        <div id="swipeContainer" class="h-full overflow-y-auto no-scrollbar pb-36 scrollable-content">
            <!-- 月檢視 -->
            <main id="monthView" class="p-3">
                <div class="calendar-grid text-center mb-2">
                    <div class="text-[9px] font-black text-rose-400">S</div>
                    <div class="text-[9px] font-black text-slate-300">M</div>
                    <div class="text-[9px] font-black text-slate-300">T</div>
                    <div class="text-[9px] font-black text-slate-300">W</div>
                    <div class="text-[9px] font-black text-slate-300">T</div>
                    <div class="text-[9px] font-black text-slate-300">F</div>
                    <div class="text-[9px] font-black text-rose-400">S</div>
                </div>
                <div id="calendarDays" class="calendar-grid"></div>
            </main>
            <!-- 年檢視 -->
            <main id="yearView" class="p-5 pb-16 hidden">
                <div id="yearHeaderIos" class="text-3xl font-black text-slate-900 mb-5 pb-3 border-b-2 border-slate-100">2026</div>
                <div id="yearMonthsIos" class="grid grid-cols-3 gap-x-4 gap-y-7"></div>
            </main>
        </div>
    </div>

    <!-- ══════════════ 當日紀錄清單 Modal ══════════════ -->
    <div id="dailyListModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[115] backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-sm rounded-[2rem] shadow-2xl p-5 border border-slate-100 max-h-[86vh] flex flex-col scrollable-content animate-in">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <div>
                    <h3 id="dailyListDate" class="text-base font-black text-slate-900"></h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">點擊查看詳情・左滑快速刪除</p>
                </div>
                <button onclick="closeDailyList()" class="p-2 bg-slate-50 rounded-full text-slate-400 active:bg-slate-100 transition">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="dailyItemsContainer" class="space-y-2.5 overflow-y-auto no-scrollbar flex-grow pb-1 scrollable-content"></div>
            <div class="mt-4 pt-4 border-t border-slate-100 shrink-0">
                <button onclick="openModalForSelected(); closeDailyList();" class="w-full py-3 bg-blue-50 text-blue-600 font-black rounded-2xl text-sm active:scale-95 transition-all flex items-center justify-center gap-2">

<script>
// ── 常數 ──────────────────────────────────────
const STORAGE_KEY = 'work_hours_v4_multi';
const WEEK_DAYS = ['日','一','二','三','四','五','六'];
const COLOR_THEMES = {
    emerald: { bg:'bg-emerald-50', text:'text-emerald-700', border:'border-emerald-200' },
    amber:   { bg:'bg-amber-50',   text:'text-amber-700',   border:'border-amber-200'   },
    rose:    { bg:'bg-rose-50',    text:'text-rose-700',    border:'border-rose-200'    },
    blue:    { bg:'bg-blue-50',    text:'text-blue-700',    border:'border-blue-200'    },
    purple:  { bg:'bg-purple-50',  text:'text-purple-700',  border:'border-purple-200'  },
    orange:  { bg:'bg-orange-50',  text:'text-orange-700',  border:'border-orange-200'  },
    pink:    { bg:'bg-pink-50',    text:'text-pink-700',    border:'border-pink-200'    }
};
const RAW_HOLIDAYS_2026 = {
    "2026-01-01":"元旦","2026-02-16":"除夕","2026-02-17":"初一",
    "2026-02-18":"初二","2026-02-19":"初三","2026-02-28":"二二八",
    "2026-04-04":"兒童節","2026-04-05":"清明節","2026-05-01":"勞動節",
    "2026-06-19":"端午節","2026-09-25":"中秋節","2026-10-10":"國慶日"
};

// ── 狀態 ──────────────────────────────────────
let currentDate   = new Date();
let selectedDateStr = new Date().toLocaleDateString('en-CA');
let isYearView    = false;
let dynamicHolidays = {};
let weekendHolidays = {};
let editingIndex  = -1;
let selectedColor = 'emerald';
let lastQueryResult = [];
let lastTotalSalary = 0;
let lastTotalHours  = 0;

// 手勢狀態
let touchStartX = 0, touchStartY = 0;
let pinchStartDist = 0;
const SWIPE_THRESHOLD = 50;

// ── 持久化資料 ────────────────────────────────
let storageData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    records: {},
    settings: {
        defaultRate: 190, defaultTitle: '上班',
        defaultStartTime: '09:00', defaultEndTime: '18:00', defaultBreak: 0,
        showTitle: true, showTime: false, showHours: true, showSalary: true, showNote: false
    },
    titleHistory: {}
};
let workData = storageData.records;

// ── 工具函式 ──────────────────────────────────
/** 格式化日期字串 "YYYY-MM-DD" */
function fmtDate(y, m, d) {
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
/** 儲存到 localStorage */
function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(storageData));
}
/** 計算兩個時間的差（分鐘），允許跨午夜 */
function timeDiffMin(sH, sM, eH, eM) {
    let diff = (eH * 60 + eM) - (sH * 60 + sM);
    if (diff < 0) diff += 1440;
    return diff;
}
/** 從 picker 讀取當前時間字串 "HH:MM" */
function getPickerTime(hKey, mKey) {
    return `${String(pickers[hKey].getValue()).padStart(2,'0')}:${String(pickers[mKey].getValue()).padStart(2,'0')}`;
}
/** 開啟 overlay */
function showOverlay(id) {
    const el = document.getElementById(id);
    el.classList.remove('hidden');
    el.classList.add('flex');
    document.body.classList.add('lock-bg');
    requestAnimationFrame(() => el.classList.add('opacity-100'));
}
/** 關閉 overlay */
function hideOverlay(id, delay = 300) {
    const el = document.getElementById(id);
    el.classList.remove('opacity-100');
    setTimeout(() => {
        el.classList.add('hidden');
        el.classList.remove('flex');
        document.body.classList.remove('lock-bg');
    }, delay);
}

// ── 假日計算 ──────────────────────────────────
function calculateHolidays() {
    dynamicHolidays = {};
    weekendHolidays = {};
    Object.entries(RAW_HOLIDAYS_2026).forEach(([dateStr, name]) => {
        const date = new Date(dateStr), dow = date.getDay();
        if (dateStr === '2026-04-04' || dateStr === '2026-04-05') {
            dynamicHolidays[dateStr] = name;
            weekendHolidays[dateStr === '2026-04-04' ? '2026-04-03' : '2026-04-06'] = `${name} 補假`;
        } else {
            dynamicHolidays[dateStr] = name;
            if (dow === 6) {
                const prev = new Date(date); prev.setDate(date.getDate() - 1);
                dynamicHolidays[prev.toISOString().split('T')[0]] = `${name} 補假`;
            } else if (dow === 0) {
                const next = new Date(date); next.setDate(date.getDate() + 1);
                dynamicHolidays[next.toISOString().split('T')[0]] = `${name} 補假`;
            }
        }
    });
}

// ── iOS Picker ────────────────────────────────
class iOSPicker {
    constructor(containerId, options, initialValue, onChange) {
        this.container = document.getElementById(containerId);
        this.originalOptions = options;
        this.onChange = onChange;
        this.options = [...options, ...options, ...options];
        this.itemHeight = 32;
        this.offsetY    = 44;
        this.currentY   = 0;
        this.isDragging = false;
        this.render();
        this.initEvents();
        this.setValue(initialValue);
    }
    render() {
        this.container.innerHTML =
            `<div class="picker-selection-bar"></div>` +
            `<div class="picker-wheel">${this.options.map(o => `<div class="picker-item">${String(o).padStart(2,'0')}</div>`).join('')}</div>`;
        this.wheel = this.container.querySelector('.picker-wheel');
        this.items = this.container.querySelectorAll('.picker-item');
    }
    initEvents() {
        let startY = 0, lastY = 0;
        const onStart = e => {
            this.isDragging = true;
            startY = lastY = e.touches ? e.touches[0].pageY : e.pageY;
            this.wheel.style.transition = 'none';
        };
        const onMove = e => {
            if (!this.isDragging) return;
            const y = e.touches ? e.touches[0].pageY : e.pageY;
            this.currentY += y - lastY;
            const totalH = this.originalOptions.length * this.itemHeight;
            if (this.currentY > -totalH / 2)     this.currentY -= totalH;
            if (this.currentY < -2.5 * totalH)   this.currentY += totalH;
            this.updateTransform();
            lastY = y;
        };
        const onEnd = () => { if (this.isDragging) { this.isDragging = false; this.snap(); } };
        this.container.addEventListener('touchstart', onStart, { passive: true });
        this.container.addEventListener('touchmove',  onMove,  { passive: true });
        this.container.addEventListener('touchend',   onEnd);
        this.container.addEventListener('mousedown',  onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup',   onEnd);
    }
    snap() {
        this.selectedIndex = Math.round(Math.abs(this.currentY) / this.itemHeight);
        this.currentY = -this.selectedIndex * this.itemHeight;
        this.wheel.style.transition = 'transform .35s cubic-bezier(.23,1,.32,1)';
        this.updateTransform();
        if (this.onChange) this.onChange(this.getValue());
    }
    updateTransform() {
        this.wheel.style.transform = `translateY(${this.currentY + this.offsetY}px)`;
        const approx = Math.abs(this.currentY) / this.itemHeight;
        this.items.forEach((item, i) => {
            const dist = Math.abs(i - approx);
            item.classList.toggle('selected', i === Math.round(approx));
            item.style.opacity   = Math.max(0.15, 1 - dist * 0.4);
            item.style.transform = `scale(${Math.max(0.78, 1 - dist * 0.05)})`;
        });
    }
    getValue() { return this.originalOptions[this.selectedIndex % this.originalOptions.length]; }
    setValue(val) {
        const idx = this.originalOptions.indexOf(parseInt(val));
        if (idx === -1) return;
        this.selectedIndex = idx + this.originalOptions.length;
        this.currentY = -this.selectedIndex * this.itemHeight;
        this.updateTransform();
    }
}

// ── Picker 初始化 ──────────────────────────────
let pickers = {};
function initPickers() {
    const hrs  = Array.from({ length: 24 }, (_, i) => i);
    const mins = Array.from({ length: 12 }, (_, i) => i * 5);
    pickers.sH = new iOSPicker('startHourPicker',   hrs,  9,  () => updatePreview());
    pickers.sM = new iOSPicker('startMinutePicker', mins, 0,  () => updatePreview());
    pickers.eH = new iOSPicker('endHourPicker',     hrs,  18, () => updatePreview());
    pickers.eM = new iOSPicker('endMinutePicker',   mins, 0,  () => updatePreview());
}

// ── 初始化 ────────────────────────────────────
function init() {
    calculateHolidays();
    initPickers();
    renderCalendar();
    setupGestureEvents();
    selectColor('emerald');
    // 防止非捲動內容被意外捲動
    window.addEventListener('touchmove', e => {
        if (document.body.classList.contains('lock-bg') && !e.target.closest('.scrollable-content')) {
            e.preventDefault();
        }
    }, { passive: false });
}

// ── 日曆渲染 ──────────────────────────────────
function renderCalendar() {
    const y = currentDate.getFullYear(), m = currentDate.getMonth();
    document.getElementById('yearDisplay').innerText = `${y}年`;
    if (isYearView) {
        document.getElementById('yearHeaderIos').innerText = y;
        renderYearView(y);
    } else {
        document.getElementById('monthDisplay').innerText = `${m + 1}月`;
        renderMonthView(y, m);
    }
    updateStats();
}

function renderMonthView(year, month) {
    const dim = new Date(year, month + 1, 0).getDate();
    const fd  = new Date(year, month, 1).getDay();
    const grid = document.getElementById('calendarDays');
    const s    = storageData.settings;
    grid.innerHTML = '';

    // 填入空格
    for (let i = 0; i < fd; i++) grid.appendChild(document.createElement('div'));

    for (let d = 1; d <= dim; d++) {
        const dStr = fmtDate(year, month + 1, d);
        const dow  = new Date(year, month, d).getDay();
        const isW  = dow === 0 || dow === 6;
        const isH  = !!dynamicHolidays[dStr];
        const isWH = !!weekendHolidays[dStr];
        const data = workData[dStr];

        const el = document.createElement('div');
        el.className = `day-cell ${isH || isWH ? 'is-holiday' : isW ? 'is-weekend' : ''}`;
        if (dStr === selectedDateStr) el.classList.add('is-today');

        // 日期數字
        const dateNumCls = (isH || isWH || isW) ? 'text-rose-500' : 'text-slate-400';
        let inner = `<div class="text-[10px] font-black ${dateNumCls}">${d}</div>`;
        if (isH) inner += `<div class="holiday-dot"></div>`;

        // 排班標籤
        if (data?.length) {
            inner += `<div class="flex flex-col gap-0.5 mt-1 overflow-hidden w-full pointer-events-none">`;
            [...data].sort((a, b) => a.startTime.localeCompare(b.startTime)).forEach(item => {
                const th  = COLOR_THEMES[item.color || 'blue'];
                const pay = Math.round(item.hours * item.rate * (isH ? 2 : 1));
                inner += `<div class="${th.bg} ${th.border} ${th.text} border-l-2 px-1 py-0.5 rounded-sm flex flex-col">`;
                if (s.showTitle)  inner += `<div class="text-[8px] font-black truncate">${item.title}</div>`;
                if (s.showTime)   inner += `<div class="text-[7px] font-bold opacity-80">${item.startTime}-${item.endTime}</div>`;
                if (s.showHours)  inner += `<div class="text-[7px] font-bold opacity-70">${item.hours.toFixed(1)}h</div>`;
                if (s.showSalary) inner += `<div class="text-[7px] font-bold opacity-70">$${pay}</div>`;
                inner += `</div>`;
            });
            inner += `</div>`;
        }

        el.innerHTML = inner;
        el.onclick = () => {
            selectedDateStr = dStr;
            if (data?.length) openDailyList(dStr);
            else renderCalendar();
        };
        grid.appendChild(el);
    }
}

function renderYearView(y) {
    const container = document.getElementById('yearMonthsIos');
    const today     = new Date().toLocaleDateString('en-CA');
    container.innerHTML = '';
    const mNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

    for (let m = 0; m < 12; m++) {
        const mDiv = document.createElement('div');
        mDiv.className = 'text-left active:opacity-50 transition-opacity cursor-pointer';
        const dim = new Date(y, m + 1, 0).getDate();
        const fd  = new Date(y, m, 1).getDay();
        let h = `<div class="text-[12px] font-black mb-1">${mNames[m]}</div><div class="grid grid-cols-7 gap-px">`;
        for (let i = 0; i < fd; i++) h += `<div></div>`;
        for (let d = 1; d <= dim; d++) {
            const ds  = fmtDate(y, m + 1, d);
            const has = workData[ds]?.length;
            const isT = ds === today;
            const isH = !!dynamicHolidays[ds];
            const isWH= !!weekendHolidays[ds];
            const isW = [0, 6].includes(new Date(y, m, d).getDay());
            h += `<div class="text-[7px] h-3.5 w-3.5 flex items-center justify-center ${
                isT ? 'bg-blue-500 rounded-full text-white'
                : has ? 'bg-slate-200 rounded-sm text-slate-900 font-bold'
                : (isH || isWH || isW) ? 'text-red-300'
                : 'text-slate-300'}">${d}</div>`;
        }
        mDiv.innerHTML = h + `</div>`;
        mDiv.onclick = () => { currentDate.setMonth(m); toggleView('month'); };
        container.appendChild(mDiv);
    }
}

// ── 月 / 年 切換 ──────────────────────────────
function toggleView(forceView) {
    if      (forceView === 'year')  isYearView = true;
    else if (forceView === 'month') isYearView = false;
    else                            isYearView = !isYearView;
    document.getElementById('monthView').classList.toggle('hidden', isYearView);
    document.getElementById('yearView').classList.toggle('hidden', !isYearView);
    document.getElementById('navHeader').classList.toggle('hidden', isYearView);
    renderCalendar();
}

// ── 換月 / 換年 ───────────────────────────────
function changeDate(v) {
    const view = document.getElementById(isYearView ? 'yearView' : 'monthView');
    view.style.transform = `translateX(${v * -20}px)`;
    view.style.opacity   = '0';
    setTimeout(() => {
        if (isYearView) currentDate.setFullYear(currentDate.getFullYear() + v);
        else            currentDate.setMonth(currentDate.getMonth() + v);
        renderCalendar();
        view.style.transform = `translateX(${v * 20}px)`;
        setTimeout(() => { view.style.transform = 'translateX(0)'; view.style.opacity = '1'; }, 10);
    }, 150);
}

function goToToday() {
    currentDate     = new Date();
    selectedDateStr = currentDate.toLocaleDateString('en-CA');
    if (isYearView) toggleView('month');
    renderCalendar();
}

// ── 統計列 ────────────────────────────────────
function updateStats() {
    if (document.getElementById('searchWrapper').classList.contains('active')) return;
    const pref = isYearView
        ? `${currentDate.getFullYear()}-`
        : `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-`;
    let sal = 0, hrs = 0;
    Object.keys(workData).forEach(d => {
        if (!d.startsWith(pref)) return;
        workData[d].forEach(item => {
            hrs += item.hours;
            sal += item.hours * item.rate * (dynamicHolidays[d] ? 2 : 1);
        });
    });
    document.getElementById('labelSalary').innerText = isYearView ? '年度預估總薪資' : '預估本月薪資';
    document.getElementById('labelHours').innerText  = isYearView ? '年度累計總工時'  : '本月累計工時';
    document.getElementById('totalSalaryNet').innerText = `$${Math.round(sal).toLocaleString()}`;
    document.getElementById('totalHoursNet').innerHTML  = `${hrs.toFixed(1)} <span class="opacity-40 text-[10px]">hr</span>`;
}

// ── 當日清單 ──────────────────────────────────

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </div>

                <div class="flex flex-col">

                </div>
                <div class="text-right">
                    <span class="text-sm font-black text-slate-800">$${pay.toLocaleString()}</span>

                </div>

}

function closeDailyList() { hideOverlay('dailyListModal'); }

// 滑動刪除手勢
let itemStartX = 0, currentSwipedEl = null;
function handleItemTouchStart(e) {
    itemStartX = e.touches[0].pageX;
    if (currentSwipedEl && currentSwipedEl !== e.currentTarget) {
        currentSwipedEl.classList.remove('swiped');
    }
}
function handleItemTouchMove(e) {
    const diff = itemStartX - e.touches[0].pageX;
    if (diff > 30)       { e.currentTarget.classList.add('swiped');    currentSwipedEl = e.currentTarget; }
    else if (diff < -30) { e.currentTarget.classList.remove('swiped'); }
}
function handleItemClick(idx, e) {
    if (e.currentTarget.classList.contains('swiped')) { e.currentTarget.classList.remove('swiped'); return; }
    openDetail(selectedDateStr, idx);
    closeDailyList();
}
function quickDelete(idx, e) {
    e.stopPropagation();
    const recs = workData[selectedDateStr];
    if (!recs?.[idx]) return;
    recs.splice(idx, 1);
    if (!recs.length) delete workData[selectedDateStr];
    persist();
    workData[selectedDateStr] ? openDailyList(selectedDateStr) : closeDailyList();
    renderCalendar();
    updateStats();
}

// ── 詳情 Modal ────────────────────────────────
function openDetail(dStr, idx) {
    selectedDateStr = dStr;
    editingIndex    = idx;
    const rec  = workData[dStr][idx];
    const mult = dynamicHolidays[dStr] ? 2 : 1;
    document.getElementById('detailDateDisplay').innerText = dStr.replace(/-/g, '/');
    document.getElementById('detailTitle').innerText       = rec.title;
    document.getElementById('detailTimeRange').innerText   = `${rec.startTime} - ${rec.endTime}（扣 ${rec.breakMinutes || 0}m）`;
    document.getElementById('detailHours').innerText       = `${rec.hours.toFixed(2)}h`;
    document.getElementById('detailSalary').innerText      = `$${Math.round(rec.hours * rec.rate * mult).toLocaleString()}`;
    const ns = document.getElementById('detailNoteSection');
    if (rec.note) { document.getElementById('detailNote').innerText = rec.note; ns.classList.remove('hidden'); }
    else ns.classList.add('hidden');
    showOverlay('detailModal');
}
function closeDetail()          { hideOverlay('detailModal'); }
function deleteSingleRecord()   {
    if (editingIndex < 0) return;
    workData[selectedDateStr].splice(editingIndex, 1);
    if (!workData[selectedDateStr].length) delete workData[selectedDateStr];
    persist(); closeDetail(); renderCalendar();
}
function editSingleRecord() {
    const rec = workData[selectedDateStr][editingIndex];
    openModalForSelected();

// ── 編輯 Modal ────────────────────────────────
function openModalForSelected() {
    if (editingIndex === -1) {
        const s = storageData.settings;
        document.getElementById('modalSubmitBtn').innerText = '加入新項目';
        document.getElementById('inputTitle').value         = s.defaultTitle;
        document.getElementById('inputRate').value          = s.defaultRate;
        document.getElementById('breakMinutes').value       = 0;
        document.getElementById('inputNote').value          = '';
        toggleBreakInput(false);
        const [sh, sm] = s.defaultStartTime.split(':').map(Number);
        const [eh, em] = s.defaultEndTime.split(':').map(Number);
        pickers.sH.setValue(sh); pickers.sM.setValue(sm);
        pickers.eH.setValue(eh); pickers.eM.setValue(em);
        selectColor('emerald');
    }
    document.getElementById('modalDate').innerText = selectedDateStr.replace(/-/g, '/');
    const h = dynamicHolidays[selectedDateStr], tag = document.getElementById('holidayTag');
    if (h) { tag.innerText = `${h} 2x`; tag.classList.remove('hidden'); } else tag.classList.add('hidden');
    updatePreview();
    showOverlay('editModal');
}
function closeModal() {
    const el = document.getElementById('editModal');
    el.classList.add('hidden'); el.classList.remove('flex');
    document.body.classList.remove('lock-bg');
    editingIndex = -1;
}

function autoFillConfig(t) {
    const c = storageData.titleHistory?.[t];
    if (!c || editingIndex !== -1) return;
    document.getElementById('inputRate').value    = c.rate;
    document.getElementById('breakMinutes').value = c.breakMinutes || 0;
    toggleBreakInput((c.breakMinutes || 0) > 0);
    selectColor(c.color || 'emerald');
    const [sh, sm] = c.startTime.split(':').map(Number);
    const [eh, em] = c.endTime.split(':').map(Number);
    pickers.sH.setValue(sh); pickers.sM.setValue(sm);
    pickers.eH.setValue(eh); pickers.eM.setValue(em);
    updatePreview();
}

function updatePreview() {
    const rate = parseFloat(document.getElementById('inputRate').value) || 0;
    const bm   = parseInt(document.getElementById('breakMinutes').value) || 0;
    const diff = timeDiffMin(pickers.sH.getValue(), pickers.sM.getValue(), pickers.eH.getValue(), pickers.eM.getValue());
    const hrs  = Math.max(0, diff - bm) / 60;
    const pay  = Math.round(hrs * rate * (dynamicHolidays[selectedDateStr] ? 2 : 1));
    document.getElementById('previewGrossHours').innerText = `${hrs.toFixed(2)}h`;
    document.getElementById('previewNetSalary').innerText  = `$${pay.toLocaleString()}`;
}

function saveData() {
    const title = document.getElementById('inputTitle').value || '打工';
    const rate  = parseFloat(document.getElementById('inputRate').value) || 0;
    const bm    = parseInt(document.getElementById('breakMinutes').value) || 0;
    const sT    = getPickerTime('sH', 'sM');
    const eT    = getPickerTime('eH', 'eM');
    const diff  = timeDiffMin(pickers.sH.getValue(), pickers.sM.getValue(), pickers.eH.getValue(), pickers.eM.getValue());
    const rec   = {
        title, rate, startTime: sT, endTime: eT, breakMinutes: bm,
        hours: Math.max(0, diff - bm) / 60,
        note:  document.getElementById('inputNote').value,
        color: selectedColor
    };
    if (!storageData.titleHistory) storageData.titleHistory = {};
    storageData.titleHistory[title] = { rate, startTime: sT, endTime: eT, breakMinutes: bm, color: selectedColor };
    if (!Array.isArray(workData[selectedDateStr])) workData[selectedDateStr] = [];
    if (editingIndex > -1) workData[selectedDateStr][editingIndex] = rec;
    else                   workData[selectedDateStr].push(rec);
    storageData.settings.defaultTitle = title;
    storageData.settings.defaultRate  = rate;
    persist();
    closeModal();
    renderCalendar();
}

function clearDayRecords() {
    if (workData[selectedDateStr]) {
        delete workData[selectedDateStr];
        persist();
        closeModal();
        renderCalendar();
    }
}

function exportData() {

function importData() {

    try {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(code))));

            storageData = decoded;

function toggleRangeStats() {

        const now   = new Date();
        const first = new Date(now.getFullYear(), now.getMonth(), 1).toLocaleDateString('en-CA');

        document.getElementById('statsEndDate').value   = now.toLocaleDateString('en-CA');

function execRangeStats() {
    const start       = document.getElementById('statsStartDate').value;
    const end         = document.getElementById('statsEndDate').value;
    const filterTitle = document.getElementById('statsFilterTitle').value.trim().toLowerCase();
    if (!start || !end) return;

    const list    = document.getElementById('rangeDetailsList');
    const summary = document.getElementById('rangeResultSummary');
    const copyBtn = document.getElementById('copyRangeBtn');
    list.innerHTML = '';
    lastQueryResult = [];
    lastTotalSalary = 0;
    lastTotalHours  = 0;
    let count = 0;

    Object.keys(workData).sort().forEach(dStr => {
        if (dStr < start || dStr > end) return;
        workData[dStr].forEach(item => {
            if (filterTitle && !item.title.toLowerCase().includes(filterTitle)) return;
            count++;
            const mult = dynamicHolidays[dStr] ? 2 : 1;
            const pay  = Math.round(item.hours * item.rate * mult);
            lastTotalSalary += pay;
            lastTotalHours  += item.hours;
            const dateObj  = new Date(dStr);
            const shortDate = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
            const weekDay   = WEEK_DAYS[dateObj.getDay()];
            lastQueryResult.push({ dateText: `${shortDate}（${weekDay}）`, timeText: `${item.startTime}-${item.endTime}`, hoursText: `${item.hours.toFixed(1)}h`, payText: `$${pay}` });

            const div = document.createElement('div');
            div.className = 'p-3.5 bg-white border border-slate-100 rounded-2xl flex justify-between items-center shadow-sm';
            div.innerHTML = `
                <div class="flex flex-col gap-1">
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-black bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full">${shortDate}（${weekDay}）</span>
                        <span class="text-[10px] font-bold text-slate-400">${item.startTime}-${item.endTime}</span>
                    </div>
                    <p class="text-sm font-black text-slate-800">${item.title}</p>
                </div>
                <div class="text-right">
                    <p class="text-base font-black text-blue-600">$${pay.toLocaleString()}</p>
                    <p class="text-[10px] font-bold text-slate-400">${item.hours.toFixed(1)}h</p>
                </div>`;
            list.appendChild(div);
        });
    });

    if (count > 0) {
        summary.classList.remove('hidden');
        copyBtn.classList.remove('hidden');
        document.getElementById('rangeTotalSalary').innerText = `$${Math.round(lastTotalSalary).toLocaleString()}`;
        document.getElementById('rangeTotalHours').innerText  = `${lastTotalHours.toFixed(1)}h`;
    } else {
        summary.classList.add('hidden');
        copyBtn.classList.add('hidden');
        list.innerHTML = '<p class="text-center py-10 text-slate-400 font-bold text-sm">此範圍內無相關紀錄</p>';
    }
}

function copyRangeToClipboard() {
    if (!lastQueryResult.length) return;
    let text = lastQueryResult.map(r => `${r.dateText} ${r.timeText} ｜ ${r.hoursText} ｜ ${r.payText}`).join('\n');
    text += `\n──────────────\n總計工時：${lastTotalHours.toFixed(1)}h\n總計薪資：$${Math.round(lastTotalSalary).toLocaleString()}`;
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand('copy');
        const btn = document.getElementById('copyRangeBtn');

        btn.innerHTML = '<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>';

}

// ── 手勢 ──────────────────────────────────────
function setupGestureEvents() {
    const app = document.getElementById('app');
    app.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
            touchStartX = e.touches[0].pageX;
            touchStartY = e.touches[0].pageY;
        } else if (e.touches.length === 2) {
            pinchStartDist = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
            );
        }
    }, { passive: true });

    app.addEventListener('touchmove', e => {
        if (e.touches.length === 1) {
            const dx = Math.abs(e.touches[0].pageX - touchStartX);
            const dy = Math.abs(e.touches[0].pageY - touchStartY);
            // 橫向滑動且不在滑動刪除容器內，阻止預設捲動
            if (dx > dy && dx > 10 && !e.target.closest('.swipe-item-container') && e.cancelable) {
                e.preventDefault();
            }
        } else if (e.touches.length === 2 && pinchStartDist > 0) {
            const d = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
            );
            if (!isYearView && d / pinchStartDist < 0.75) {
                toggleView('year');
                pinchStartDist = 0;
            }
        }
    }, { passive: false });

    app.addEventListener('touchend', e => {
        if (e.changedTouches.length === 1 && e.touches.length === 0) {
            const dx = e.changedTouches[0].pageX - touchStartX;
            const dy = e.changedTouches[0].pageY - touchStartY;
            // 確認是水平滑動才換月
            if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > SWIPE_THRESHOLD) {
                changeDate(dx > 0 ? -1 : 1);
            }
        }
        pinchStartDist = 0;
    }, { passive: true });
}

window.onload = init;
</script>
</body>
